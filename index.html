  * { box-sizing: border-box; }

  /* ---------- topic picker ---------- */
  .masthead { margin: 8px 0 22px; }

  .topic {

  .topic .count {

    background: var(--surface); border: 1px solid var(--line); color: var(--ink);

  .backbtn:hover { border-color: var(--accent); }
  .decktitle { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- the card ---------- */
  .flip { display: grid; perspective: 1600px; }
  .flip-inner {
    grid-area: 1 / 1; display: grid; transform-style: preserve-3d; position: relative;
    transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.25, 1);
    cursor: pointer;
  }
  .flip.flipped .flip-inner { transform: rotateY(180deg); }

  .face-front { align-items: center; justify-content: center; text-align: center; gap: 14px; position: relative; }

  }

  .face-front .hint { font-size: 12px; color: var(--ink-2); }

  .face-back { transform: rotateY(180deg); gap: 12px; overflow-y: auto; max-height: 64vh; }

    padding: 2px 8px; border-radius: 4px; align-self: flex-start;
  }
  .row.tr .lbl { background: var(--accent-soft); color: var(--accent-text); align-self: flex-start; }
  .row.num .lbl { background: var(--accent-soft); color: var(--accent-text); }
  .row.def .lbl { background: var(--redo-soft); color: var(--redo); }
  .row.log .lbl { background: var(--logic-soft); color: var(--logic); }
  .row .txt { font-size: 15.5px; line-height: 1.55; }
  .row.tr .txt { font-size: 17px; font-weight: 600; line-height: 1.5; }
  .row.num .txt, .row.def .txt, .row.log .txt { direction: ltr; text-align: left; }
  .row.num .txt { font-family: var(--mono); font-size: 13.5px; }
  .row.log .txt { color: var(--ink-2); }

  /* ---------- controls ---------- */
  .controls { display: flex; gap: 10px; margin-top: 16px; }
  .controls button {
    flex: 1; border-radius: 12px; padding: 14px 10px; font-size: 16px; font-weight: 700;

  .btn-redo { background: transparent; color: var(--redo); border-color: var(--redo) !important; }
  .btn-good:hover, .btn-redo:hover { filter: brightness(1.06); }
  .keyshint { text-align: center; color: var(--ink-2); font-size: 11.5px; margin-top: 10px; }
  .keyshint span { font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; direction: ltr; display: inline-block; }

  /* ---------- end screen ---------- */
  .endcard {

  .endcard h2 { margin: 8px 0 2px; font-size: 26px; }

  }
  .endcard .big .known { color: var(--good); }
  .endcard p { color: var(--ink-2); margin: 6px 0 0; font-size: 14.5px; line-height: 1.55; }
  .endactions { display: flex; gap: 10px; margin-top: 22px; }
  .endactions button {
    flex: 1; border-radius: 12px; padding: 13px 10px; font-size: 15px; font-weight: 700;

  .endactions button.primary { background: var(--accent); border-color: var(--accent); color: #1E2A36; }
  .endactions button:hover { filter: brightness(1.05); }

  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .flip-inner { transition: none; }
    .topic, .progress > div, .controls button { transition: none; }
  }
  @media (max-width: 430px) {
    #app { padding: 14px 10px 30px; }
    .face { padding: 20px 16px; min-height: 300px; }
    .tallies { display: none; }
  }
</style>

"use strict";
const TOPICS = [{"id": "01", "en": "SITE CONDITIONS", "he": "תנאי שטח וסביבה", "cards": [{"tr": "חוק בנייה מקומי או מדינתי שנועד להגן על בריאות ובטיחות הציבור. חשוב למבחן: מפקח בית לא קובע התאמה לקוד (code compliance) בבדיקה.", "t": "Building Code"}, {"tr": "שקיעת המבנה כלפי מטה — נגרמת ממחזורי קיפאון-הפשרה בקרקע, הכנת שטח לקויה או ניהול מים גרוע (מרזבים וצינורות ירידה).", "def": "Signs of ongoing or differential settlement — stair-step cracks, sloping floors, doors that will not latch.", "log": "Water + gravity — poor water management around the foundation is the usual cause.", "t": "Settlement"}, {"tr": "שקיעה דיפרנציאלית — חלק אחד של הבית שוקע והשני לא. חמורה יותר משקיעה אחידה.", "def": "Stair-step cracking along mortar joints; a crack wider at the top indicates settlement at one end.", "t": "Differential settlement"}, {"tr": "עיבוי — אדי מים שהופכים לנוזל (או כפור) על הצד הפנימי של מעטפת הבניין. אוורור עליית גג וחוסם אדים מפחיתים אותו.", "def": "Condensation or frost in the attic — indicates inadequate ventilation.", "log": "Water force — warm moist air meets a cold surface.", "t": "Condensation"}, {"tr": "עופרת — מתכת רעילה בצבע ובצנרת של בתים ישנים. הטיפול וההסרה לפי הנחיות הרשות הסביבתית.", "def": "Peeling / deteriorated paint in an older home = potential lead hazard; recommend evaluation by a qualified specialist.", "t": "Lead"}, {"tr": "אסבסט — חומר סיבי טבעי בבתים ישנים (בידוד, אריחי תקרה, רצפות). מסוכן כשיש סיבים נשימים באוויר.", "def": "Damaged or deteriorated suspected asbestos-containing material — do not disturb; recommend specialist evaluation.", "t": "Asbestos"}, {"tr": "פריך — חומר (אסבסט) שמתפורר לאבקה בלחיצת יד קלה. אסבסט פריך = משחרר סיבים לאוויר = הסיכון האמיתי.", "t": "Friable"}, {"tr": "כליאה — מריחת חומר אוטם על חומר מכיל אסבסט כדי למנוע שחרור סיבים, במקום הסרה.", "t": "Encapsulation"}, {"tr": "גז רדיואקטיבי חסר צבע וריח שעולה מהקרקע אל תוך הבית. בדיקת רדון היא מעבר להיקף הבדיקה הסטנדרטית — ממליצים על בדיקה ייעודית.", "t": "Radon"}, {"tr": "חד-תחמוצת הפחמן — תוצר בעירה חסר צבע וריח, \"הרוצח השקט\". מקורות: מחליף חום סדוק, ארובה חסומה, מכונית במוסך.", "num": "CO alarms outside each sleeping area · on every floor · required when there is a fuel-burning appliance or attached garage.", "def": "Fuel-burning appliances or attached garage without CO alarms.", "log": "Heat/fire family — combustion gases must exit up and out; when they don't, CO enters the home.", "t": "Carbon Monoxide (CO)"}, {"tr": "תרכובות אורגניות נדיפות — גזים שנפלטים ממוצרים ביתיים (צבעים, דבקים, חומרי ניקוי).", "t": "Volatile Organic Compounds (VOCs)"}, {"tr": "פורמלדהיד — גז שנפלט מלוחות עץ מעובד ודבקים, בעיקר בבתים משנות ה-70.", "t": "Formaldehyde"}, {"tr": "עובש — נוצר מלחות. כלל הזהב: קודם מתקנים את בעיית המים, אחר כך את העובש.", "def": "Visible mold-like staining and the moisture source that feeds it.", "log": "Water force — no moisture, no mold.", "t": "Mold"}, {"tr": "קיר תמך — מבנה אנכי שמרסן תזוזת קרקע או מים.", "num": "weep holes 4 in.", "def": "Leaning, bulging or cracked retaining wall; missing or clogged weep holes (hydrostatic pressure buildup).", "log": "Water force — trapped water pushes the wall; weep holes relieve the pressure.", "t": "Retaining Wall"}, {"tr": "גביון — קיר תמך כובד העשוי סלים ממולאים באבנים.", "t": "Gabion"}, {"tr": "עוגן קבור בקרקע שקושר קיר תמך אחורה (tieback) נגד התהפכות.", "t": "Dead man"}, {"tr": "שיפוע הקרקע סביב הבית — חייב להוליך מים הרחק מהיסוד.", "num": "6 in drop over the first 10 ft · finish grade 1 in per foot, minimum 6 ft.", "def": "Flat or negative grade directing surface water toward the foundation.", "log": "Slopes family — water flows downhill; make downhill point away from the house.", "t": "Grading"}, {"tr": "הטופוגרפיה — צורת פני הקרקע סביב הבית (ערוצים, עמקים). לימוד הטופוגרפיה קובע לאן זורמים מי הנגר.", "t": "Topography"}, {"tr": "מפלס מי התהום — הגבול העליון של המים בקרקע.", "t": "Water table"}, {"tr": "סחף קרקע. שיפוע חד מדי סביב הבית = סחיפת קרקע במקום ניקוז מבוקר.", "t": "Erosion"}, {"tr": "חלחול — נזילה איטית של מים דרך קרקע או קיר.", "t": "Seepage"}, {"tr": "ציפוי מונע רטיבות על קיר היסוד — מאט מעבר לחות (פחות מאיטום מלא waterproofing).", "t": "Damp proofing"}, {"tr": "נקז היקפי — צינור פלסטיק מחורר 3–4 אינץ' לאורך תחתית קיר היסוד, אוסף מי תהום ומרחיק אותם; מתנקז לבור שאיבה או החוצה. ניקוז היסוד לא תמיד מגיע למשאבה.", "def": "Evidence of basement / crawl space water intrusion suggesting failed or absent perimeter drainage.", "log": "Water force — collect the water before it finds the foundation wall.", "t": "Drain Tile / Perimeter Drain"}, {"tr": "משאבת בור — משאבה חשמלית בבור במרתף; המים מתנקזים אליו ונשאבים החוצה מהבית.", "def": "Sump pump inoperative at the time of inspection.", "t": "Sump Pump"}, {"tr": "מי נגר (גשם) — אסור לנקז אותם למערכת הביוב; מנקזים לשטח, לחלחול או לניקוז ייעודי.", "def": "Storm water (downspouts, sump discharge) connected to the sewer system.", "t": "Storm water"}, {"tr": "מערכת טיהור שפכים פרטית בשטח — מיכל רקב (עיכול ביולוגי) + שדה חלחול. גודל המערכת נקבע לפי מספר חדרי השינה.", "num": "typical tank ~1,000 gal · pumping every 3–5 years · well to drain field ~100 ft.", "def": "Lush green grass, soggy soil or odor over the drain field = failing system; vehicles or trees over the field.", "t": "Septic System"}, {"tr": "שדה חלחול — השפכים המסוננים מהמיכל מחלחלים בו לקרקע; באזורים בלי ביוב עירוני. הסדר: Tank → Distribution box → Drain field.", "def": "Driving, parking or planting trees over the drain field.", "t": "Leech Field (Drain Field)"}, {"tr": "בור שפכים ישן — מיכל תת-קרקעי לאגירת שפכי הבית (בטון, מתכת או דפנות בלוקים/אדנים), בלי שדה חלחול. קדם למערכת הספטית.", "t": "Cesspool"}, {"tr": "באר מים פרטית — מכסה אטום, מיכל לחץ, משאבה טבולה (מודרני) לעומת Jet pump (ישן).", "num": "well to septic drain field ~100 ft (varies by state).", "def": "Unsealed / damaged well cap; well located too close to the septic drain field.", "t": "Well"}, {"tr": "גדר בטיחות סביב בריכה — הדרישות נועדו למנוע כניסת ילד ללא השגחה.", ound.", "def": "Siding in contact with soil or below required ground clearance; peeling paint (moisture indicator).", "log": "Ground-clearance ladder — the more moisture-sensitive the material, the higher above grade it must be.", "t": "Siding"}, {"tr": "חיפוי עץ — הבעיה העיקרית היא רטיבות; העץ שואב לחות דרך קצוות הסיבים (end grains).", "num": "6 in above ground.", "def": "Wood siding closer than 6 in to grade; swelling or flaking paint indicating moisture.", "log": "\"6\" family + water force.", "t": "Wood siding"}, {"tr": "חיפוי ויניל — הצבע הוא חלק מהחומר עצמו; עמיד וזול, פופולרי עד היום.", "num": "nail head 3/8 in.", "log": "Thicknesses family — 3/8 is the small-parts number.", "t": "Vinyl siding"}, {"tr": "חיפוי פיברצמנט — לוח דחוס של סיבי בטון; עמיד ולא נרקב.", "num": "5/16 in thickness.", "log": "Thicknesses family.", "t": "Fiber cement siding"}, {"tr": "טיח חוץ — אגרגטים + חומר מקשר + מים על גבי רשת. נוטה להיסדק.", "num": "weep screed 2 in above ground / 4 in above pavement.", "def": "Weep screed missing or buried below grade; cracks admitting moisture behind the stucco.", "log": "\"2 inch\" family + water force — the screed lets trapped water weep out at the bottom.", "t": "Stucco"}, {"tr": "חיפוי אלומיניום עם גימור אמייל אפוי בתנור.", "t": "Aluminum siding"}, {"tr": "לוח קשיח — שבבי עץ + סיבים בדבק תחת חום ולחץ (Masonite הוא שם מותג). רגיש מאוד לרטיבות.", "def": "Swelling or deterioration at bottom edges from moisture absorption.", "t": "Masonite / Hardboard"}, {"tr": "חיפוי גרגירים צבעוניים מודבקים לאספלט — נפוץ משנות ה-30 עד ה-50.", "t": "Composition Asphalt Siding"}, {"tr": "חיפוי לוחות רחבים לסירוגין עם פסי עץ צרים (battens) שמכסים את התפרים.", "t": "Board and Batten Siding"}, {"tr": "לבני בוץ — מחומרי הבנייה הקדומים: אדמה, קש/זבל ומים.", "t": "Adobe"}, {"tr": "אבן — קירות ויסודות בבתים ישנים; כיום קיימת גם אבן מהונדסת/חיקוי לחיפוי.", "t": "Stone"}, {"tr": "ציפוי לבנים על שלד עץ — קיר ציפוי אינו קיר נושא. נשען דרך עוגני מתכת.", "num": "22 gauge metal t  = פגם מדווח; טחב (moss) מעיד על גיל הגג.", "num": "15 lb felt underlayment · two layers in severe climates.", "def": "Alligatoring, hail damage, curling or missing shingles.", "t": "Asphalt shingles"}, {"tr": "Shake — מבוקע (split), מראה גס; Shingle — מנוסר (sawn), מראה אחיד. שניהם עץ, נמכרים בחבילות (bundles), שני מסמרים לכל יחידה; המרווח ביניהם נקרא Keyway.", "num": "minimum slope 4 in 12 · 2 nails each.", "log": "Shake = Split — זכרי לפי ה-S הגסה; Slopes family for the 4:12.", "t": "Wood Shake vs Wood Shingle"}, {"tr": "הלשונית — החלק החשוף של רעף רצועות, מוגדר ע\"י החיתוכים (cutouts).", "t": "Tab"}, {"tr": "דירוג האש הגבוה ביותר לחיפויי גג — עמידות מרבית לחשיפת אש חיצונית.", "log": "Heat/fire family.", "t": "Class A (roof fire rating)"}, {"tr": "יריעת תשתית מתחת לרעפים (וגם: שכבת החלקה מתחת לריצוף פנים).", "num": "shingle roof 15 lb felt · concrete tile 30 lb · severe climates two layers.", "def": "Missing / deteriorated underlayment exposed at eaves.", "log": "Water force — the backup layer when water gets past the shingles.", "t": "Underlayment"}, {"tr": "לוחות הסיכוך שעליהם יושב הגג — הבסיס למסמור הרעפים.", "num": "roof sheathing 5/8 in.", "log": "Thicknesses family — 5/8 = fire and roof.", "t": "Sheathing (roof)"}, {"tr": "קליפס H — מהדק מתכת בצורת H בין שני לוחות סיכוך; מקשיח את התפר בין הלוחות בגג.", "t": "H Clip"}, {"tr": "חפיפת הרעפים — Head lap: החפיפה האנכית מעל התפר; Side lap: החפיפה הצידית.", "num": "head lap 2 in · side lap 4–6 in · rakes 1 in.", "log": "\"2 inch\" family — water can't climb 2 inches uphill.", "t": "Head lap / Side lap"}, {"tr": "פח איטום — פחי מתכת דקים בכל חדירה ומפגש בגג: ארובות, צינורות, עמקים, דורמרים ושולי גג; מנתבים מים החוצה.", "num": "galvanized valley flashing 26 gauge · roof nail flashing — nails only to the roof.", "def": "Missing, rusted or improperly lapped flashing at roof penetrations.", "log": "Water force — every hole in the roof needs a metal detour for water.", "t": "Flashing"}, {"tr": "עמק — מפגש ה-V של שני מישורי גג, שם זורמים המים; פח העמק מונח בתוכו. מפגש עמק עם קיר אנכי = נקודת חדירת מים קלאסית.", "num": "galvanized valley flashing 26 gauge.", "def": "Debris-filled or rusted valleys; water intrusion at valley-to-wall transitions.", "t": "Valley / Valley Flashing"}, {"tr": "פלשינג נגדי — שכבת פלשינג שנייה שמכסה את הראשונה; בקיר לבנים נכנס לחריץ במלט (groove / mortar joint).", "def": "Counter flashing pulled out of the mortar joint or sealed with caulk only.", "t": "Counter flashing"}, {"tr": "פלשינג סינר — הפח בצד הנמוך (downhill) של ארובה או פתח בגג.", "t": "Apron flashing"}, {"tr": "צווארון סערה — טבעת איטום סביב צינור שחודר את הגג (vent boot).", "t": "Storm collar"}, {"tr": "פס משופע משולש במעבר גג-קיר (roof-to-wall) — מרכך את זווית ה-90° ליריעות האיטום.", "t": "Cant strip"}, {"tr": "אוכף — גג משני קטן מאחורי הארובה שמפצל את זרימת המים סביבה ומונע הצטברות שלג וקרח.", "def": "Missing cricket behind a wide chimney — ice / debris buildup and leakage.", "log": "Water force — water must be steered around the obstacle, not dammed behind it.", "t": "Cricket (Saddle)"}, {"tr": "סכר קרח — שלג נמס מחום שבורח מהבית, קופא בקצה הגג הקר וחוסם את הניקוז; המים נערמים ונכנסים מתחת לרעפים. מניעה: בידוד + אוורור עליית הגג. אופייני לגג בשיפוע נמוך עם soffit רחב.", "def": "Staining at eaves / exterior walls consistent with ice damming; inadequate attic insulation and ventilation.", "log": "Heat force — escaping heat melts the snow; the cold eave refreezes it.", "t": "Ice dam"}, {"tr": "שולי הגג הבולטים מעבר לקיר. שלושת הרכיבים: Soffit — התחתית האופקית; Fascia — הלוח האנכי בקצה; Frieze board — הלוח שצמוד לקיר מתחת לבליטה.", "t": "Eave"}, {"tr": "הסופיט — התחתית האופקית של בליטת הגג; לרוב מחורר כדי להכניס אוויר לאוורור עליית הגג.", "def": "Blocked soffit vents (insulation stuffed into the eaves).", "log": "Ventilation — air enters low at the soffit and exits high at the ridge.", "t": "Soffit"}, {"tr": "השפה המשופעת של הגג — הקצה שרץ מה-eave עד הרכס בצד הגמלון.", "num": "rake overhang 1 in.", "t": "Rake"}, {"tr": "כרכוב — האזור הבולט שמתחת לקצה הגג; מגן על קירות המבנה (בוויקטוריאני — מקושט). גם: פס גימור עליון (trim piece).", "t": "Cornice"}, {"tr": "קישוט רכס — עיטור ברזל מחושל או מעקה דקורטיבי לאורך רכס הגג בבתים ויקטוריאניים.", "t": "Cresting"}, {"tr": "צריח מחודד — גג מתחדד או עיטור מתכת בראש מגדל/צריח.", "t": "Spire"}, {"tr": "מעקה גג — קיר בשולי גג (שטוח) שמונע נפילה.", "t": "Parapet"}, {"tr": "דורמר — מבנה שבולט דרך גג משופע ויוצר חלל שמיש עם חלון וגובה ראש.", "t": "Dormer"}, {"tr": "רפטר — קורת הגג המשופעת; נמשכת מקצות קורות התקרה עד לוח הרכס.", "t": "Rafter"}, {"tr": "Hip rafter — יוצר את הזווית החיצונית של הגג; Valley rafter — את הזווית הפנימית (לרוב כפול, שני רכיבים בעובי 2 אינץ'); Jack rafter — רפטר מקוצר מהקיר אל hip או מעמק אל רכס.", "t": "Hip Rafter / Jack Rafter / Valley Rafter"}, {"tr": "Ridge board — לוח חיבור בלבד בראש הרפטרים, לא נושא עומס; Ridge beam — קורה נושאת שדורשת תמיכה בקצוות. ההבחנה קריטית בשאלות מבנה.", "def": "Ridge beam without end support; rafter separation at the ridge.", "log": "Gravity — a board just connects; a beam carries load down to posts.", "t": "Ridge Board vs Ridge Beam"}, {"tr": "אגדים מהונדסים — מסגרת רפטרים, מוטות וקורות שיוצרת את תמיכת הגג. אסור לחתוך, לקדוח או לשנות בשום צורה.", "def": "Cut, drilled or field-modified engineered truss = reportable structural defect.", "log": "Exam favorite — any truss modification is automatically a defect.", "t": "Trusses"}, {"tr": "קורות צווארון — קורות אופקיות בין שני רפטרים בעליית הגג; נושאות עומס נוסף ומונעות מהקירות להידחף החוצה.", "log": "Collar tie = Attic — זה הרכיב שרואים גבוה בין הרפטרים.", "t": "Collar Beams (Collar Ties)"}, {"tr": "זיז — הארכת רפטר מעבר לקו הקיר; רכיב קטן שממוסמר לרפטר גדול ליצירת בליטת הגג.", "t": "Outrigger"}, {"tr": "הבליטה — אזור ה-eave/soffit שמשתרבב החוצה מהקיר (ר' Cornice).", "t": "Overhang"}, {"tr": "Ridge vent — פתח אוורור רציף לאורך הרכס, בנקודה הגבוהה ביותר; Ridge shingles — הרעפים שמכסים את הרכס.", "log": "Heat force — hot air exits at the top; the ridge is the top.", "t": "Ridge Vent / Ridge Shingles"}, {"tr": "מנתבי אוויר (Rafter vents / Channel vents / Vent chutes) — פסי קלקר בצד הפנימי של גג עליית הגג ששומרים על מעבר אוויר מהסופיט אל עליית הגג, שהבידוד לא יחסום.", "def": "Insulation blocking soffit-to-attic airflow (missing baffles).", "t": "Attic Baffles"}, {"tr": "כדור מלט בקצה רעפי Hip & Ridge — סוגר את קצה הרעף.", "t": "Mud ball"}, {"tr": "מלט גגות — מסטיק לתיקוני גג נקודתיים; Lap cement — דבק החפיפה שמצמיד יריעות/רעפים זה לזה.", "t": "Roofing cement / Lap cement"}, {"tr": "חיבור מרזב לפשיה — מסמר ארוך (Spike) דרך צינורית מרווח (Ferrule).", "t": "Gutter to fascia"}]}, {"id": "04", "en": "STRUCTURAL", "he": "שלד ויסודות", "cards": [{"tr": "היסוד — הבסיס שעליו נבנה כל המבנה. יסוד גבוה = מרתף מרווח; יסוד נמוך = חלל זחילה צר.", "log": "Gravity — everything above ends up here.", "t": "Foundation"}, {"tr": "פוטינג — בסיס הבטון מתחת לקיר היסוד, יושב מתחת לקו הכפור (frost line) ותומך בכל המבנה.", "def": "Footing above the frost line — frost heave movement.", "log": "Gravity — the last stop of the load path; below frost so the ground under it never moves.", "t": "Footings"}, {"tr": "יציקה מונוליטית — הפוטינג וקיר היסוד (או המשטח) נוצקים יחד ביציקה אחת. לעומת Floating slab — קודם פוטינג, אחר כך משטח, בשתי יציקות.", "t": "Monolithic Construction"}, {"tr": "חריץ נעילה — שקע שנוצר בפוטינג לפני יציקת הקיר מעליו; נועל את שני חלקי הבטון יחד ומחזק את התפר.", "t": "Keyway (foundation)"}, {"tr": "קורת המסד — הקורה האופקית שיושבת על קיר היסוד ועליה נבנה שלד העץ (בפתחים: המדף בבסיס חלון/דלת).", "num": "wood framing on concrete/masonry foundation 8 in above grade.", "def": "Rot or insect damage at the sill plate; sill not anchored to the foundation.", "log": "Ground-clearance ladder — the first wood the ground water looks for.", "t": "Sill (Sill Plate)"}, {"tr": "סדקי יסוד — שאלת אבחון קלאסית: אנכי = התכווצות בטון, לרוב מינורי; אלכסוני = שקיעה קלה, לעקוב; מדורג (stair-step) = שקיעה דיפרנציאלית, רציני; אופקי = לחץ קרקע/מים — החמור ביותר.", "def": "Horizontal crack with bowing/bulging wall = serious structural problem; measure width and check displacement between the two sides.", "log": "Water force — horizontal cracks mean the soil and water are pushing the wall in.", "t": "Foundation cracks"}, {"tr": "לחץ הידרוסטטי — לחץ מים בקרקע שדוחף את קיר היסוד פנימה. התנפחות/בליטה ביסוד (foundation bulge) = לחץ הידרוסטטי.", "def": "Bowed or bulging foundation wall; horizontal cracking.", "log": "Water force — water that can't drain pushes.", "t": "Hydrostatic pressure"}, {"tr": "פריחת מלחים — משקע לבן אבקתי על בטון או לבנים; מוכיח שמים עברו דרך החומר והשאירו מלחים.", "def": "Efflorescence near a crack = water has moved through it.", "log": "Water force — the salt is the water's signature.", "t": "Efflorescence"}, {"tr": "אנכי מדויק — 90° מהמאוזן (level). קיר \"out of plumb\" = נוטה.", "t": "Plumb"}, {"tr": "חלל זחילה — החלל הנמוך בין תחתית קומת הקרקע לאדמה.", "num": "access opening 16 × 24 in · wood joists above exposed ground 18 in · ventilation 1/150 · vents within 3 ft of each corner.", "def": "Standing water / moisture, wood below required clearance, blocked vents or inaccessible access.", "log": "Working-clearances family (16×24) + ground-clearance ladder (18) + ventilation ratios (1/150).", "t": "Crawl Space"}, {"tr": "קורה ראשית — קורת עץ או פלדה גדולה שנושאת עומסים מרוכזים לאורכה (הקורה שמתחת לקורות הרצפה).", "num": "untreated girder above exposed earth 12 in · air space at a girder end entering masonry 1/2 in.", "def": "Girder end in a masonry pocket without an air space — trapped moisture and rot.", "log": "Ground-clearance ladder — 18 joist → 12 girder; the ½ in air gap lets the wood breathe.", "t": "Girder"}, {"tr": "קורות רצפה/תקרה — קורות ארוכות שמגשרות בין קירות נושאים או עמודי היסוד.", "num": "wood joists above exposed ground (crawl space) 18 in · joist notch 0 in (אין לחתוך).", "def": "Cut / notched / sagging joists; joists below required ground clearance.", "log": "Ground-clearance ladder — joists are the most exposed wood, so they get the biggest number (18).", "t": "Joists"}, {"tr": "קורת שפה — הקורה שרצה סביב היקף קורות הרצפה וסוגרת אותן.", "t": "Rim Joist"}, {"tr": "האחות — חיזוק קורת רצפה פגומה או מוחלשת ע\"י הצמדת קורה נוספת לצידה לכל האורך.", "log": "The fix for a damaged or weakened floor joist.", "t": "Sistering"}, {"tr": "קיר נושא — כל קירות החוץ + כל קיר פנים שמיושר מעל קורה/גירדר; מעביר את העומס האנכי עד ליסוד ונושא את מערכת אגדי הגג.", "def": "Load-bearing wall altered or removed without proper support.", "log": "Gravity — the load path must be continuous from roof to foundation.", "t": "Load Bearing Wall"}, {"tr": "קיר לא נושא — נושא רק את משקל עצמו (ציפוי לבנים = לא נושא; לבני זכוכית אסורות בקיר נושא). Bearing partition — מחיצת פנים שכן נושאת עומס אנכי.", "t": "Nonbearing Wall / Bearing Partition"}, {"tr": "מסגור בלון — בנייה ישנה: זקפים רצים ברצף מקורת המסד עד הגג (מעל 10 רגל), בלי הפסקת פלטפורמה בין קומות.", "def": "Open stud cavities acting as chimneys — missing fire blocking.", "log": "Heat/fire force — a continuous cavity is a fire highway; that's why fire blocking exists.", "t": "Balloon Framed Construction"}, {"tr": "מסגור פלטפורמה — הסטנדרט המודרני: בונים שכבה על שכבה — פלטפורמה, זקפים, פלטפורמה נוספת, עד הגג.", "t": "Platform Framing"}, {"tr": "מסגור עמודים וקורות — רכיבים גדולים מזקפים רגילים, לרוב 4 או 6 אינץ' מרובע.", "t": "Post and Beam Framing"}, {"tr": "חצי עץ — שיטת בנייה עם שלד עץ חשוף וטיח או לבנים שממלאים את המרווחים (סגנון טיודור).", "t": "Half Timber"}, {"tr": "בנייה מחבילות קש עם גימור דמוי טיח מעליהן.", "t": "Straw Bale"}, {"tr": "תבניות בידוד מבטון — בלוקים/פאנלים מקלקר שנערמים, ממולאים בטון ונשארים במקומם כבידוד קבוע.", "t": "Insulating Concrete Forms (ICFs)"}, {"tr": "פלטה — רכיב 2x4/2x6 אופקי בשלד; Soleplate — הפלטה התחתונה בבסיס קיר הזקפים (Top plate — העליונה).", "t": "Plate / Soleplate"}, {"tr": "קורת פתח — הקורה מעל חלון/דלת שמעבירה את העומס לצדי הפתח.", "def": "Sagging header — cracked drywall / sticking door above an opening.", "log": "Gravity — the load detours around the hole.", "t": "Header"}, {"tr": "Jack (Trimmer) — הזקף הקצר שתומך ב-header משני הצדדים; King — הזקף המלא שצמוד אליו מהרצפה עד התקרה; Cripple — זקף קצר מעל ה-header או מתחת לאדן החלון.", "t": "Jack stud / King stud / Cripple stud"}, {"tr": "חסימת אש — רכיבים אופקיים קצרים בין זקפים, בערך באמצע גובה הקיר.", "log": "Heat/fire force — breaks the vertical chimney inside the wall; every gap buys time.", "t": "Fire Block"}, {"tr": "עצירת אש — סגירה אטומה של חלל נסתר נגד התפשטות אש ועשן: cross blocking, מילוי חורי חיווט בבידוד, חסימות בקו הסופיט.", "def": "Open chases / unsealed penetrations between floors.", "t": "Fire Stop"}, {"tr": "אלכסון משוקע — לוח 1 אינץ' בחריצים אלכסוניים בזקפים, או רצועת מתכת בצורת L (~10 רגל) לייצוב קיר חוץ או פינה.", "t": "Let-in Brace"}, {"tr": "חיזוק רוח — רצועות מתכת או בלוקי עץ באלכסון מהפלטה התחתונה לעליונה; מונעים מהקיר להתעוות או ליפול \"כמו דומינו\" (racking).", "t": "Wind Bracing"}, {"tr": "זיז — קומה או רצפה שבולטת מעבר ליסוד או לקיר התמיכה שמתחתיה.", "t": "Cantilever"}, {"tr": "עמוד — רכיב אנכי שתומך בקורות ובגג. עמודים קלאסיים: דורי, יוני, קורינתי, טוסקני, קומפוזיטי (אדריכלות Greek Revival).", "t": "Column / Post"}, {"tr": "עמוד לאלי — עמוד פלדה עגול ממולא בטון במרתף, עם התאמת גובה הברגה למעלה; תמיכה נוספת לבית.", "t": "Lally Column"}, {"tr": "עמוד ג'ק — תמיכת מתכת מתכווננת (פינים + בורג) שמחליפה רכיב תמיכה ישן.", "def": "Temporary jack posts used as permanent support without footings.", "t": "Jack Post (Monopost)"}, {"tr": "לוחית חיזוק — לוח שמחזק חיבור בין רכיבים (למשל בצמתי אגדים).", "t": "Gusset"}, {"tr": "עץ מהונדס — אגדים, קורות, gluelam, microlam ו-joists המיוצרים מחתיכות עץ קטנות בהדבקה/חיבור מכני לרכיב גדול וחזק.", "t": "Engineered Lumber"}, {"tr": "קורת לוחות מודבקים בלחץ — דירוג חוזק גבוה מעץ מנוסר מלא.", "t": "Microlam (LVL)"}, {"tr": "קורת I מהונדסת — רכיב מבני בצורת האות I; משמש כקורות רצפה ורפטרים.", "t": "TJI (I-Joist)"}, {"tr": "לוח שבבים מכוונים — לוח עץ מהונדס, שבבים מודבקים בדחיסה.", "t": "Oriented Strand Board (OSB)"}, {"tr": "לוח שבבים גדולים (1–2 אינץ') — תחליף דיקט לסיכוך קירות וגג.", "t": "Wafer Board"}, {"tr": "סיכוך — שכבת לוחות על הזקפים, הקורות והרפטרים; מקשיחה את השלד ומשמשת בסיס לכיסוי החיצוני.", "t": "Sheathing (wall)"}, {"tr": "עץ מטופל בלחץ — מוספג בכימיקלים (כמו CCA) נגד ריקבון וחרקים; חובה בכל מגע עם קרקע ומים.", "def": "Untreated wood in ground contact.", "log": "Ground-clearance ladder — if you can't lift the wood, treat it.", "t": "Pressure-Treated Wood"}, {"tr": "היפרדות שכבות — שכבות לוח (דיקט) שנפרדות כשהדבק כושל; נגרם כמעט תמיד מלחות עודפת.", "def": "Delaminated sheathing / panels.", "log": "Water force.", "t": "Delamination"}, {"tr": "קימוט/כיפוף — התעקמות חומר בנייה מבלאי או ממגע עם חומר זר (או עומס).", "t": "Buckling"}, {"tr": "מעטפת הבניין — כל הבית מהיסוד עד הגג; עוטפת את חלל המגורים ומגינה מפגעי מזג האוויר.", "t": "Building Envelope"}, {"tr": "בנייה קשה — בנייה באריח, לבנים, בטון או אבן. לקיר בנייה בידוד תרמי נמוך.", "t": "Masonry"}, {"tr": "ר' Grout בפרק החוץ — מלט + מים לאיטום חריצים.", "t": "Grout (masonry)"}, {"tr": "חריץ — חיתוך רוחבי בקצה קורה. במחברת: joist notch = 0 אינץ' — לא חותכים חריץ בקורה.", "def": "Notched or over-bored floor joists.", "t": "Notch"}, {"tr": "מרכז-למרכז — מדידת המרווח בין זקפים/קורות/רפטרים ממרכז רכיב אחד למרכז הבא (למשל 16\" OC).", "t": "On Center (OC)"}, {"tr": "יארד מעוקב בטון = 3'x3'x3' = 27 רגל מעוקב; מספיק ל-80 רגל רבוע של משטח בעובי 3 אינץ'.", "t": "Yard of Concrete"}, {"tr": "קימור — עקמומיות מכוונת (או לא) בקורה. Curvature — עקמומיות כללית.", "t": "Camber"}, {"tr": "טרמיטים תת-קרקעיים — חיים באדמה, צריכים לחות, ובונים מנהרות בוץ (shelter tubes / mud tubes) אל העץ. המזיק ההרסני ביותר בארה\"ב; נכנסים לרוב מאזור המוסך אל שלד העץ.", "def": "Mud tubes on the foundation; wood-to-soil contact — the #1 invitation for termites.", "log": "Water force — they need moisture; dry, separated wood doesn't feed them.", "t": "Subterranean termites"}, {"tr": "טרמיטי עץ יבש — חיים בתוך העץ עצמו בלי מגע עם אדמה. הסימן: גלולות צואה (fecal pellets).", "t": "Drywood termites"}, {"tr": "חיפושיות אבקה — הסימן: אבק צהוב דק + חורי יציאה עגולים בעץ.", "def": "Fresh yellow frass and exit holes in structural wood.", "t": "Powderpost beetles"}, {"tr": "נמלים נגריות — לא אוכלות עץ, חופרות בו; ערימות נסורת נקייה. מעידות על עץ רטוב/רקוב.", "log": "Water force — find the ants, find the moisture.", "t": "Carpenter ants"}, {"tr": "פטריות וריקבון — הורסות את העץ; צריך בערך 20% לחות בעץ. עץ רך, מתפורר וכהה. קודם מתקנים את המים, אחר כך מטפלים.", "def": "Decayed structural wood and the moisture source feeding it.", "log": "Water force — every pest/rot problem is a water problem first.", "t": "Fungi / Rot"}, {"tr": "תנאים מזמינים — מה שמזמין מזיקים ורקב: צמחייה צמודה לבית, ערימות עץ, לחות בחלל זחילה, ניקוז לקוי, מגע עץ-קרקע.", "def": "Wood-to-soil contact, vegetation against the structure, poor drainage.", "t": "Conducive conditions"}]}, {"id": "05", "en": "ELECTRICAL", "he": "חשמל", "cards": [{"tr": "כניסת החשמל העילית — הכבלים מעל הקרקע מחברת החשמל אל הבית (מתחת לקרקע = Service lateral).", "num": "10 ft above grade/walkable area · 12 ft above a driveway · 18 ft above a public road · 3 ft from windows, doors, porches, decks.", "def": "Service drop below required clearances or within reach of windows and decks.", "log": "Service-drop ladder — the taller the thing passing under, the higher the wire: אדם 10 → מכונית 12 → משאית 18.", "t": "Service Drop"}, {"tr": "תורן השירות — צינור אנכי קשיח עם כובע שירות בראשו, על הגג או הקיר; דרכו נכנסים כבלי החשמל.", "def": "Loose, bent or rusted service mast.", "t": "Service Mast"}, {"tr": "Weatherhead — הכובע האטום בקצה העליון של התורן; Drip loop — לולאת כבל כלפי מטה מתחתיו, כדי שמי גשם יטפטפו מהלולאה ולא ייכנסו פנימה בצינור.", "def": "Missing drip loop — water entry into the service equipment.", "log": "Water force — water runs to the bottom of the loop and drips off.", "t": "Weatherhead & Drip loop"}, {"tr": "לוח הכניסה הראשי — הארון שבו החשמל נכנס למערכת הבית; ציוד השירות = המפסקים, הנתיכים והמתגים הראשיים בכניסה.", "num": "minimum service 100 amp · 200 amp service = home with electric heat · 3 wires: Hot + Hot + Neutral = 120/240 V.", "log": "Wire & amps family.", "t": "Service Entrance Panel / Service Equipment"}, {"tr": "Line — הצד שלפני המפסק הראשי (תמיד \"חי\", לא מנותק); Load — הצד שאחרי המפסקים, שיוצא אל מעגלי הבית.", "t": "Line side / Load side"}, {"tr": "בלוח הראשי האפס וההארקה מחוברים יחד (bonded) — זו הנקודה היחידה במערכת שבה זה קורה; בלוח משנה הם מופרדים, וההזנה היא 4 חוטים (2 hot + neutral + ground).", "def": "Neutral and ground bonded together in a sub panel.", "log": "One bonding point only — at the service.", "t": "Main Panel (bonded) vs Sub Panel"}, {"tr": "מרווח העבודה מול לוח החשמל. אסור לוח בארון בגדים, באמבטיה, מעל מדרגות או במקום שדורש טיפוס.", "num": "depth 36 in · width 30 in · height 6 ft 6 in.", "def": "Panel blocked by storage, in a prohibited location, or lacking working clearance.", "log": "Working-clearances family — the more dangerous the equipment, the more room it gets.", "t": "Panel working clearance"}, {"tr": "מפסק אוטומטי — מתג שמנתק את המעגל בעומס-יתר או קצר; \"קופץ\" (trips) וניתן לדריכה ידנית מחדש.", "log": "Breaker trips · Fuse melts.", "t": "Circuit Breaker"}, {"tr": "נתיך — מוליך שנמס כשעובר זרם עודף ופותח את המעגל; חד-פעמי. נתיך יושב רק על המוליך החי.", "def": "Oversized fuse for the circuit conductor (fire hazard).", "t": "Fuse"}, {"tr": "קופסת נתיכים / לוח מפסקים — הארון שמחלק את ההזנה למעגלי משנה עם הגנה (נתיך או מפסק) לכל מעגל.", "t": "Fuse Box / Breaker Box (Circuit Panel)"}, {"tr": "מעגלים סופיים — המעגלים שיוצאים מהלוח ומחלקים את החשמל לחדרים ולשקעים.", "t": "Branch Circuits"}, {"tr": "מעגל ייעודי — מעגל נפרד למכשיר אחד.", "num": "water heater & dryer 30 A / 240 V · electric range 40 amp · refrigerator / gas closet dryer 20 amp.", "log": "Wire & amps family.", "t": "Dedicated circuit"}, {"tr": "שקע — 120V לתאורה ומכשירים רגילים, 240V לתנור/מייבש/מזגן. חריץ צר = Hot, חריץ רחב = Neutral, החור העגול = Ground.", "num": "outlet spacing 6–12 ft.", "def": "Open ground, reversed polarity, or damaged receptacles.", "log": "\"6\" family — a lamp cord reaches 6 ft, so no point on a wall is more than 6 ft from an outlet.", "t": "Receptacle (Outlet)"}, {"tr": "קוטביות הפוכה — חוט חי ואפס שהוחלפו בשקע; קל לתיקון אבל מסוכן — המכשיר \"חי\" גם כשהוא כבוי.", "def": "Reversed polarity at receptacles — potential shock hazard.", "t": "Reversed polarity"}, {"tr": "מפסק פחת — מזהה חוסר איזון בין הזרם היוצא לחוזר = דליפת זרם, ומנתק מיד. נדרש בכל מקום שבו מים + חשמל: מטבח, אמבטיות, חוץ, מוסך, מרתף, כיורי בר וכביסה.", "num": "trips at ~5 milliamps.", "def": "Missing GFCI protection in wet locations; GFCI that fails the test button.", "log": "Wire & amps family — 5 mA is the tiny leak that saves a life; GFCI protects people, AFCI protects the house.", "t": "GFCI (Ground Fault Circuit Interrupter)"}, {"tr": "מפסק קשת — מזהה דפוס של קשת חשמלית (ניצוץ מכבל פגום) ומנתק; מגן מפני שריפה. בקוד ישן — חדרי שינה; בקוד עדכני — כמעט כל אזורי המגורים.", "def": "Missing AFCI protection where required (per adopted code).", "log": "GFCI = shock (people, water areas) · AFCI = fire (living areas). Dual-function breaker does both.", "t": "AFCI (Arc Fault Circuit Interrupter)"}, {"tr": "הארקה — מסלול בטוח לזרם תקלה אל האדמה דרך מוט הארקה (grounding rod) או הארקת יסוד (UFER); מגינה מהתחשמלות ומברקים.", "def": "Broken / loose grounding conductor or clamp; missing ground rod connection.", "t": "Grounding"}, {"tr": "Hot (ungrounded, שחור/אדום) — מביא את המתח; Neutral (grounded, לבן) — מחזיר את הזרם; Ground (ירוק/נחושת חשופה) — הגנה בלבד. Multi-wire circuit = שני Hot + Neutral משותף.", "t": "Conductors (Hot / Neutral / Ground)"}, {"tr": "כושר הולכה — הזרם המרבי שחוט יכול לשאת בבטחה. הכלל: דירוג המפסק ≤ כושר ההולכה של המוליך.", "num": "14 AWG = 15 amp · 12 AWG = 20 amp · 10 AWG = 30 amp · 8 AWG = 40 amp · 6 AWG = 55–60 amp.", "def": "Oversized breaker on a small conductor (14 AWG on a 20 A breaker) — fire hazard.", "log": "Wire & amps family — start at 14=15, every 2-gauge jump down adds 5–10 amps; smaller AWG number = thicker wire.", "t": "Ampacity"}, {"tr": "חיווט אלומיניום — כיום מותר רק למעגלי 240V גדולים; חיבורים דורשים משחה נגד חמצון (antioxidant paste). אלומיניום נושא פחות מנחושת: 12 AWG = 15A בלבד.", "def": "Solid aluminum branch wiring (1960s–70s) — overheating connections; recommend evaluation.", "t": "Aluminum wiring"}, {"tr": "חיווט ישן על גלילי חרסינה — אין בו חוט הארקה, ואסור שיהיה קבור בתוך בידוד (מתחמם).", "def": "Active knob-and-tube wiring; K&T buried in insulation.", "log": "Heat force — old wiring needs air around it to shed heat.", "t": "Knob and tube"}, {"tr": "BX — כבל בציפוי מתכת שדרוך, לשימוש פנימי; UF — כבל לשימוש חיצוני/קבור באדמה.", "t": "BX cable / UF cable"}, {"tr": "קופסת חיבורים — כל חיבור חוטים (splice) חייב להיות בתוך קופסה נגישה ומכוסה.", "def": "Open splices outside a box; missing cover plates; buried junction boxes.", "t": "Junction Box"}, {"tr": "Splice — חיבור חוטים; Wire nut — כובעון פלסטיק שמחבר חוטים חשופים; Pigtail — חוט קצר שמחבר כמה חוטים לנקודה אחת.", "t": "Splices / Wire Nut / Pigtail"}, {"tr": "שני חוטים תחת בורג אחד במפסק — פגם נפוץ שמדווחים עליו (אלא אם המפסק מאושר לשניים).", "def": "Double-tapped breaker.", "t": "Double tapping"}, {"tr": "תעלת חיווט — מערכת שמובילה, עוטפת ומגינה על מוליכים.", "t": "Raceway"}, {"tr": "איגוד — חיבור כל חלקי המתכת (צנרת מים מתכתית, צנרת גז, ציוד) יחד ולהארקה, כדי שלא ייווצרו הפרשי מתח. סביב בריכה — equipotential bonding grid.", "def": "Metallic water / gas piping not bonded; CSST without its required separate bonding.", "t": "Bonding"}, {"tr": "קוד החשמל הלאומי — כללי חיווט בטוח; הקוד המקומי (המחייב בחוק) יכול להיות שונה ממנו.", "t": "NEC (National Electrical Code)"}, {"tr": "מעבדת בדיקות עצמאית — בודקת ומאשרת מוצרי חשמל (UL listed = נבדק ואושר).", "t": "Underwriters' Laboratories (UL)"}, {"tr": "זרם חילופין — מחליף כיוון במחזוריות (רשת הבית); זרם ישר — כיוון אחד בלבד (סוללות, תאים סולאריים).", "t": "Alternating Current (AC) / Direct Current (DC)"}, {"tr": "Voltage — הלחץ החשמלי שדוחף את הזרם בחוטים; Amp — יחידת הזרם עצמו. Watts = Volts × Amps.", "num": "240 V × 30 A = 7,200 watts (חישוב מבחן קלאסי).", "t": "Voltage / Amp"}, {"tr": "Ammeter מודד זרם (Amps) · Voltmeter מודד מתח (Volts) · Ohmmeter מודד התנגדות (Ohms) — וגם רציפות (Continuity) ואיגוד.", "t": "Ammeter / Voltmeter / Ohmmeter"}, {"tr": "מפסק הניתוק החיצוני ליד יחידת המזגן — חובה ניתוק חיצוני בטווח ראייה מהיחידה.", "def": "Missing exterior disconnect at the condenser.", "t": "A/C Disconnect"}, {"tr": "גופי תאורה שקועים בעליית גג/תקרה מבודדת חייבים דירוג IC (Insulation Contact) — מותרים במגע עם בידוד.", "def": "Non-IC recessed fixtures buried in insulation — fire hazard.", "log": "Heat force.", "t": "IC rated (recessed lights)"}, {"tr": "כבל מאריך — פתרון זמני בלבד; מכשיר קבוע דורש חיווט קבוע.", "def": "Extension cords used as permanent wiring.", "t": "Extension cord"}, {"tr": "מערכת תאורה במתח נמוך — לא נכללת בבדיקת הבית הסטנדרטית.", "t": "Low voltage lighting"}, {"tr": "גלאי עשן — בכל קומה כולל מרתף, מחוץ לכל אזור שינה, ובתוך כל חדר שינה. בבנייה חדשה: מחווטים + גיבוי סוללה + מקושרים (אחד מצפצף — כולם).", "def": "Missing / non-functional smoke alarms at required locations.", "t": "Smoke alarms"}, {"tr": "נקודת החיבור בין מספר חוטים (וגם: חיבורי המתנה של החשמלאי בשלב ה-Rough).", "t": "Electrical Pigtails (service)"}]}, {"id": "06", "en": "COOLING", "he": "קירור", "cards": [{"tr": "מחזור הקירור — הסדר הנכון: Compressor → Condenser → Metering device → Evaporator. המערכת סגורה: לא \"ממלאים גז\" אלא אם יש דליפה.", "log": "דחיסה → עיבוי בחוץ → ויסות → אידוי בפנים.", "t": "The Cooling Cycle"}, {"tr": "המדחס — הרכיב הראשי ביחידה החיצונית; דוחס ומסחרר את חומר הקירור.", "t": "Compressor"}, {"tr": "המעבה — יחידת המאוורר החיצונית; פולטת את החום החוצה והופכת את הגז חזרה לנוזל (Liquefy → Condenser).", "def": "Condenser not level, fins damaged/clogged, or missing exterior disconnect.", "t": "a/c Condenser"}, {"tr": "סליל המאייד — בתוך הבית; סופג את החום מהאוויר הפנימי ומקרר אותו.", "log": "Evaporator absorbs (בפנים) · Condenser rejects (בחוץ).", "t": "Evaporator Coil"}, {"tr": "שסתום ההתפשטות — מווסת את כניסת חומר הקירור למאייד.", "t": "Metering device (Thermal expansion valve)"}, {"tr": "חומר הקירור (בעבר פריאון) — נוזל/גז שמעביר את החום במחזור סגור.", "t": "Refrigerant"}, {"tr": "טון קירור.", "num": "1 ton = 12,000 BTU/h · 3-ton system = 36,000 BTU/h.", "t": "One ton (AC)"}, {"tr": "מי עיבוי — תופעה נורמלית בזמן קירור; מתנקזים מאגן הניקוז של סליל המאייד, רצוי בכוח הכבידה אל ניקוז רצפה.", "def": "Rust / overflow at the drain pan; condensate line not draining with the flow.", "log": "Gravity — the desirable drain goes with the flow.", "t": "Condensate"}, {"tr": "מצנן אידוי — מעביר אוויר דרך רפידות רטובות; מתאים לאקלים יבש (מדבר, דרום-מערב ארה\"ב).", "t": "Swamp Cooler (Evaporative cooler)"}, {"tr": "מדד יעילות הקירור העונתי של מזגן (כמו AFUE לחימום, HSPF למשאבת חום).", "t": "SEER"}, {"tr": "משאבת חום — מעבירה חום מאזור קר לחם; מזגן הפיך (מחמם בחורף, מקרר בקיץ). הגודל נקבע לפי עומס הקירור; אדים מהיחידה החיצונית בהפשרה (defrost) = נורמלי.", "num": "balance point ~35°F — מתחת לזה נכנס חימום עזר (auxiliary / emergency heat).", "def": "Heat pump running on emergency heat continuously.", "log": "Temperatures family — the pump gives up at 35, the same number as the refrigerator.", "t": "Heat Pump"}, {"tr": "תעלות האוויר — מובילות אוויר מחומם/מקורר מהמערכת לכל הבית וחזרה. תעלות באזור לא ממוזג (עליית גג, חלל זחילה) חייבות להיות מבודדות ואטומות.", "def": "Disconnected, crushed or uninsulated ducts in unconditioned spaces.", "t": "Ductwork / Duct"}, {"tr": "הרשתות/מפזרי האוויר — מווסתים את זרימת האוויר בפתחי התעלות.", "t": "Registers"}, {"tr": "Supply — האוויר שיוצא אל החדרים; Return — האוויר שחוזר למערכת. חוסר בפתחי חזרה = לחצים לא מאוזנים בבית.", "t": "Supply / Return"}, {"tr": "תרמוסטט — בקר שמדליק ומכבה חימום/קירור אוטומטית לפי טמפרטורה מכוונת.", "t": "Thermostat"}, {"tr": "חלוקת הבית לאזורי טמפרטורה נפרדים; שסתום אזור (ליד הדוד) שולט בזרימת מים/קיטור לכל אזור לפי תרמוסטט אזורי.", "t": "Zone System / Zone Valve"}, {"tr": "טווח טמפרטורת החוץ שבו בודקים מערכת קירור בלי לסכן אותה.", "num": "60–65°F.", "log": "Temperatures family.", "t": "Outdoor temperature for HVAC inspection"}]}, {"id": "07", "en": "HEATING", "he": "חימום", "cards": [{"tr": "תנור אוויר מאולץ — מפוח שמעביר את החום מהדלק ומסחרר אותו בתעלות. אוויר מאולץ = שליטה מלאה: סינון, ניקוי סליל, הוספת לחות. התחזוקה העיקרית: המסנן (כיוון החץ — אל תוך התנור).", "def": "Dirty / missing filter; filter installed against the airflow arrow.", "t": "Force Air Furnace"}, {"tr": "מחליף החום — המקום בתנור שבו חום הבעירה עובר לאוויר הבית בלי שהגזים ייגעו בו. הסכנה הגדולה ביותר בחימום גז: סדק במחליף = דליפת CO, \"הרוצח השקט\". סימן: להבות \"רוקדות\". מחליף סדוק — מחליפים, לא מתקנים.", "def": "Cracked heat exchanger — dancing flames, soot, CO at registers; replace the furnace/exchanger.", "log": "Heat force — combustion gases must stay sealed on their way up and out.", "t": "Heat Exchanger"}, {"tr": "מכשיר אדים על התנור — הסיכון: חלודה במחליף החום.", "log": "Water force — water + steel = rust, even inside the furnace.", "t": "Humidifier (on furnace)"}, {"tr": "דוד הסקה — כלי סגור שמחמם מים ומסחרר אותם כמים חמים או קיטור. שסתום שחרור הלחץ יושב ישירות על הדוד; צנרת גז/מים חמים = ברזל שחור.", "def": "Missing / leaking pressure relief valve on the boiler.", "t": "Boiler"}, {"tr": "חימום הידרוני — חימום באמצעות נוזל/מים (Hydro = מים): דוד, צנרת, רדיאטורים או צינורות ברצפה.", "t": "Hydronic system"}, {"tr": "חימום קיטור — דוד וצנרת שמובילים קיטור לרדיאטורים (בתים ישנים).", "t": "Steam heat system"}, {"tr": "רדיאטור — גוף מתכת עם צינורות שדרכם עוברים קיטור או מים חמים ומקרינים חום לחדר.", "t": "Radiator"}, {"tr": "חימום קרינה — כבלים או צינורות בתוך הרצפה, הקירות או התקרה שמחממים את המסה עצמה.", "t": "Radiant heating system"}, {"tr": "חימום פנלים — גופי חימום (חשמל או מים חמים) לאורך היקף הקיר במקום הפנל.", "t": "Baseboard heat"}, {"tr": "משאבת הסחרור — מסחררת מים חמים/קיטור במערכת; במערכת מאולצת מחפשים משאבה. מאפשרת גם אזורי חימום נפרדים.", "t": "Circulating Motor / Pump"}, {"tr": "בקר טמפרטורת המים בדוד (Aqua = מים).", "t": "Aquastat"}, {"tr": "מיכל התפשטות — מיכל קטן במערכת מים חמים שנותן למים המתחממים לאן להתרחב; מונע פיצוץ צנרת ואביזרים.", "log": "Heat force — heated water expands; give it room or it finds its own.", "t": "Expansion Tank"}, {"tr": "שחרור אוויר — הוצאת אוויר כלוא ממערכת חימום מים (רדיאטור שקר בחלקו העליון = אוויר כלוא).", "t": "Bleeding"}, {"tr": "הולכה — מעבר חום דרך מוצקים; הסעה — מעבר חום ע\"י נוזלים/אוויר נעים (Convector = גוף חימום שמניע אוויר).", "t": "Conduction / Convection"}, {"tr": "מדף ויסות — לוחית/שסתום שמווסת את זרימת האוויר בארובת תנור או אח.", "t": "Damper"}, {"tr": "מעשנה — המעבר הסגור שמוציא עשן וגזי בעירה החוצה.", "log": "Heat force — smoke wants up; the flue is its road.", "t": "Flue"}, {"tr": "צינור/תעלת פליטה לאוויר וגזים החוצה (וגם: החלק הזז של אגף חלון).", "t": "Vent"}, {"tr": "ארובת מתכת כפולת דופן — לגז בלבד; אסורה לעץ או פחם.", "def": "Wood/coal appliance vented into a Type B gas vent.", "t": "Type B vent"}, {"tr": "קטגוריות ארובה לפי לחץ וטמפרטורה: I — לחץ שלילי, לא מעבה (Type B); III — לחץ חיובי, נירוסטה אטומה; IV — לחץ חיובי, מעבה (condensing) — צינור PVC/CPVC לבן מהקיר + ניקוז מי עיבוי. Category IV = יעילות גבוהה.", "num": "condensing furnace AFUE 90%+ (standard 80%).", "t": "Vent Categories (I–IV)"}, {"tr": "יעילות ניצול דלק שנתית של תנור חימום.", "num": "80% standard · 90%+ condensing.", "t": "AFUE"}, {"tr": "תרמוקפל — חיישן להבת הביקורת (pilot light); כשהלהבה כבית הוא סוגר את שסתום הגז.", "def": "Pilot won't stay lit — failed thermocouple.", "t": "Thermocouple"}, {"tr": "פרופאן — גז כבד מהאוויר; דליפה יורדת לרצפה ומצטברת למטה (בניגוד לגז טבעי שעולה).", "log": "Heavy gas falls — that's why propane appliances in pits/basements are riskier.", "t": "Propane"}, {"tr": "צינור העשן מהתנור לארובה — אסור אופקי לגמרי; חייב שיפוע כלפי מעלה לכיוון הארובה.", "def": "Smoke pipe in a dead-level position or sloping down.", "log": "Heat force — flue gases climb; give them a ramp.", "t": "Smoke pipe"}, {"tr": "ברז ניתוק גז — ליד כל מכשיר גז.", "num": "within 6 feet of the appliance.", "def": "Missing / inaccessible shutoff at a gas appliance.", "log": "\"6\" family.", "t": "Gas shutoff valve"}, {"tr": "מלכודת משקעים — קטע צינור אנכי קצר על קו הגז, ממש לפני המכשיר; אוסף לכלוך ולחות שלא ייכנסו לשסתום.", "def": "Missing sediment trap ahead of gas appliances.", "log": "Gravity — debris falls into the leg instead of the valve.", "t": "Sediment trap (Dirt leg)"}, {"tr": "צנרת ברזל שחור — הצנרת המסורתית לגז ולמים חמים של דוד.", "t": "Black iron pipe"}, {"tr": "צינור גז נירוסטה גמיש (צהוב) — חייב הארקה/איגוד נפרד בגלל סכנת ניקוב מפגיעת ברק. שאלה נפוצה במבחן.", "def": "CSST without separate bonding — lightning puncture and fire hazard.", "t": "CSST"}, {"tr": "מחבר גז גמיש למכשיר — אסור שיעבור דרך קיר, רצפה או תקרה.", "def": "Flexible gas connector passing through a wall or floor; unsupported, rusted or flaking gas piping.", "t": "Flexible connector (gas)"}, {"tr": "איתור דליפת גז — מי סבון בלבד, לעולם לא להבה. ריח גז חזק = לפנות את הבית ולהזעיק.", "t": "Gas leak detection"}, {"tr": "אוויר בעירה — אספקת אוויר טרי לתנור/דוד. חלל פתוח מספיק לבד; חלל סגור צריך שני פתחים — אחד גבוה ואחד נמוך.", "num": "unconfined space 50 cu ft per 1,000 BTU/h · confined indoor 1 sq in per 1,000 BTU/h × 2 openings · direct from outdoors 1 sq in per 4,000 BTU/h.", "def": "Furnace / water heater in a sealed closet without combustion air openings.", "log": "Ventilation ratios — outdoor air is cleaner, so it needs 4× less area (4,000 vs 1,000).", "t": "Combustion Air"}, {"tr": "זרימה הפוכה — גזי בעירה שחוזרים לתוך הבית במקום לצאת בארובה. סימנים: פיח, לחות, ריח וכתמים סביב ה-draft hood.", "def": "Soot / staining / melted grommets at the draft hood — evidence of backdrafting.", "log": "Heat force — when the house sucks harder than the flue, the gases turn around.", "t": "Backdrafting"}, {"tr": "שסתום שחרור — נפתח אוטומטית בטמפרטורה או לחץ עודפים (בדוד חימום — ישירות על הדוד).", "log": "Temperatures & pressures family.", "t": "Relief Valve"}]}, {"id": "08", "en": "INSULATION & VENTILATION", "he": "בידוד ואוורור", "cards": [{"tr": "התנגדות למעבר חום — גבוה יותר = בידוד טוב יותר. בידוד דחוס או רטוב מאבד R-value.", "num": "current code attic R-38 to R-60 · walls 2×4 R-13/15 · walls 2×6 R-19/21 (במחברת הישנה: R-30 attic / R-19 walls).", "def": "Compressed, wet or missing insulation.", "log": "R = Resistance = high is good · U = the opposite.", "t": "R-Value"}, {"tr": "מוליכות חום של חלון/דלת — ההפך מ-R: נמוך יותר = בידוד טוב יותר. חלונות נמדדים ב-U.", "log": "The exam trap — R high good, U low good.", "t": "U-Value"}, {"tr": "בידוד — חומר שמתנגד לאיבוד חום (פיברגלס, צמר סלעים, תאית, קלקר); בקירות, תקרות, מרתפים וחללי זחילה — יוצר את המעטפת התרמית. מותקן בהתזה (blown) או ביריעות (batts).", "t": "Insulation"}, {"tr": "בידוד תאית — 80–85% נייר ממוחזר.", "t": "Cellulose insulation"}, {"tr": "קצף תאים סגורים — בידוד בצפיפות (וב-R) הגבוהים ביותר.", "t": "Closed cell foam"}, {"tr": "יריעות בידוד גמישות — בין הזקפים בקירות.", "t": "Batts / Blankets"}, {"tr": "בידוד תפזורת — מפוזר בעליית הגג.", "t": "Loose (blown) insulation"}, {"tr": "חוסם אדים — יריעה עמידת לחות שמונעת מאדי מים חמים להיכנס לבידוד ולהתעבות בקיר. תמיד בצד החם של הקיר, פונה אל מקור החום. גבס עם גב נייר כסף = חוסם אדים.", "def": "Vapor barrier on the cold side of the assembly.", "log": "Water force — stop the vapor before it reaches a cold surface and condenses.", "t": "Vapor Barrier"}, {"tr": "נקודת הטל — הטמפרטורה שבה אוויר רווי מתחיל להתעבות: Saturated air → Condensation → Dew point.", "t": "Dew point"}, {"tr": "אמיסיביות — כושר פליטת חום קורן של משטח (Emit radiant heat).", "t": "Emissivity"}, {"tr": "הסתננות אוויר — מעבר אוויר פנימה והחוצה דרך סדקים, תפרים וחורים; מורגש כרוח פרצים (draft spot).", "t": "Infiltration"}, {"tr": "אוורור עליית הגג — אוויר נכנס נמוך בסופיט ויוצא גבוה ברכס; מונע עיבוי בחורף וסכרי קרח.", "num": "attic 1/300 · crawl space 1/150 · crawl vents within 3 ft of each corner.", "def": "Inadequate attic ventilation — condensation, frost or delaminated sheathing.", "log": "Ventilation ratios — the crawl space is smaller and wetter, so it needs double the venting (150 vs 300).", "t": "Attic ventilation"}, {"tr": "פתחי האוורור: Soffit — בתחתית הבליטה (כניסה); Ridge — לאורך הרכס (יציאה); Gable — בקיר הגמלון בצד.", "log": "Heat force — in low, out high.", "t": "Soffit vent / Ridge vent / Gable vent"}, {"tr": "אפקט הארובה — אוויר חם תמיד עולה; הבית עצמו מתנהג כמו ארובה ושואב אוויר קר מלמטה.", "t": "Stack effect"}, {"tr": "מאוורר כל-הבית — בתקרה; מושך אוויר קריר פנימה דרך החלונות ודוחף אוויר חם לעליית הגג והחוצה.", "t": "Whole House Fan"}, {"tr": "מערכת אוורור עם השבת חום — מעבירה חלק מהחום מהאוויר היוצא אל האוויר הטרי הנכנס.", "num": "exterior exhaust opening at least 3 ft from doors and windows.", "log": "3-feet family.", "t": "HRV / ERV"}, {"tr": "ונטה באמבטיה — חייבת לפלוט החוצה מהבית; אסור לעליית גג או לחלל נסתר.", "def": "Bath fan discharging into the attic — moisture and mold.", "log": "Water force — dump the moisture outside, not into the structure.", "t": "Bathroom exhaust fan"}, {"tr": "צינור פליטת מייבש — חלק, קצר וישר ככל האפשר, החוצה בלבד.", "num": "duct diameter 4 in · screws max 1/8 in (לא ברגים שחודרים לתעלה — אוספים מוך).", "def": "Plastic / screwed / lint-clogged dryer duct, or duct terminating indoors — fire hazard.", "log": "Heat/fire force — lint + heat is a fire recipe.", "t": "Dryer vent"}, {"tr": "מפוח המטבח — הבעיה האופיינית: הצטברות שומן (grease buildup).", "t": "Kitchen exhaust"}, {"tr": "מאוורר תקרה — התקלה הנפוצה: חוסר איזון (out of balance).", "t": "Ceiling paddle fan"}, {"tr": "חלון כפול/משולש — שתי שכבות זכוכית או יותר עם גז אינרטי ב דורשות תיקון (זה לא Home Inspection).", "t": "Walk-Through"}, {"tr": "ניתוח ממצאים — לא \"מה זה\" אלא \"מה עושים עם מה שראית\": Observe (מה ראית — עובדה) → Identify (איזה רכיב) → Determine implication (בטיחות? מבנה? כסף?) → Recommend (תיקון / מומחה / מעקב).", "log": "מדווחים את שנצפה, לא מנחשים סיבה; מפנים למומחה מורשה כשזה מעבר להיקף.", "t": "Analysis of Findings"}, {"tr": "סיווג ממצאים — Safety hazard: סכנה מיידית, עדיפות עליונה; Major/Material: משפיע על ערך או בטיחות; Minor/Maintenance: תחזוקה; Monitor: לעקוב; Further evaluation: להפנות למומחה.", "t": "Findings classification"}, {"tr": "ICC — מועצת הקודים הבינלאומית, מפתחת קודים ותקנים; NAHB — איגוד בוני הבתים, מרכז המחקר שלו עזר לפתח תקני בנייה ירוקה.", "t": "ICC / NAHB"}, {"tr": "חוק עזר מקומי — תקנה של הרשות המקומית.", "t": "Community ordinance"}, {"tr": "חישובי המבחן שחוזרים.", "num": "Watts = Volts × Amps (240 × 30 = 7,200) · 1 ton = 12,000 BTU/h · attic 1,500 sq ft ÷ 300 = 5 sq ft vents · 1 ft = 12 in · 1 sq ft = 144 sq in · 1 yard = 3 ft · 1 cu yd concrete = 27 cu ft.", "log": "Ventilation ratios + wire & amps — the same family numbers, just asked as arithmetic.", "t": "Exam calculations"}]}, {"id": "14", "en": "GENERAL VOCABULARY", "he": "אוצר מילים כללי", "cards": [{"tr": "יציאה / כניסה.", "t": "Egress / Ingress"}, {"tr": "קובע / מכריע.", "t": "Determining"}, {"tr": "נבדק.", "t": "Examined"}, {"tr": "מתרחש / קורה.", "t": "Occur"}, {"tr": "קבוע ועקבי / משתנה ומתנודד.", "t": "Consistent / Fluctuates"}, {"tr": "נתיב / מסלול מעבר.", "t": "Pathway"}, {"tr": "חדירה (של מים, או חדירת צינור דרך גג/קיר).", "t": "Penetration"}, {"tr": "לח / לחות. קו כהה על קיר = רטיבות (Dark line = damp).", "t": "Damp / Dampness"}, {"tr": "טפטוף.", "t": "Dribbles"}, {"tr": "נקודת פרצת רוח — איטום לקוי.", "t": "Draft spot"}, {"tr": "מחובר במסמרות.", "t": "Riveted"}, {"tr": "הונח (לבנה שהונחה).", "t": "Laid"}, {"tr": "משולש.", "t": "Triangular"}, {"tr": "הצטלבות / מפגש.", "t": "Intersection"}, {"tr": "קוטר.", "t": "Diameter"}, {"tr": "בריח (ר' כרטיס Deadbolt בפרק החוץ).", "t": "Dead bolt"}]}];

const LS_KEY = "nhieFlashScores.v1";
const $ = (id) => document.getElementById(id);

const state = {
  topic: null,      // topic object being played
  queue: [],        // cards left this round
  reviewPile: [],   // cards marked "redo" this round
  idx: 0,
  round: 1,
  firstRoundTotal: 0,
  firstRoundKnown: 0,
  goodCount: 0,
  redoCount: 0,
  flipped: false,
};

/* ---------- helpers ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function loadScores() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch (e) { return {}; }
}
function saveScore(topicId, known, total) {
  const s = loadScores();
  s[topicId] = { known, total, when: Date.now() };
  try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { /* private mode */ }
}
function show(viewId) {
  ["view-topics", "view-deck", "view-end"].forEach((v) => $(v).classList.toggle("hidden", v !== viewId));
  window.scrollTo(0, 0);
}

/* ---------- topic picker ---------- */
function renderTopics() {
  const scores = loadScores();
  const grid = $("topicGrid");
  grid.innerHTML = "";
  const allCards = TOPICS.flatMap((t) => t.cards.map((c) => ({ ...c, _topicHe: t.he })));

  const makeTile = (id, num, he, en, count, extraClass) => {
    const btn = document.createElement("button");
    btn.className = "topic" + (extraClass ? " " + extraClass : "");
    const last = scores[id];
    btn.innerHTML =
      '<span class="num">' + num + "</span>" +
      '<span class="he">' + he + "</span>" +
      '<span class="en">' + en + "</span>" +
      '<span class="meta"><span class="count">' + count + ' כרטיסים</span>' +
      (last ? '<span class="last">קודם: ' + last.known + "/" + last.total + "</span>" : "") +
      "</span>";
    grid.appendChild(btn);
    return btn;
  };

  TOPICS.forEach((t) => {
    const btn = makeTile(t.id, t.id, t.he, t.en, t.cards.length, "");
    btn.addEventListener("click", () => startDeck(t));
  });
  const allBtn = makeTile("all", "00", "כל הנושאים", "FULL SWEEP", allCards.length, "all");
  allBtn.addEventListener("click", () =>
    startDeck({ id: "all", he: "כל הנושאים", en: "FULL SWEEP", cards: allCards })
  );
}

/* ---------- deck flow ---------- */
function startDeck(topic) {
  state.topic = topic;
  state.queue = shuffle(topic.cards);
  state.reviewPile = [];
  state.idx = 0;
  state.round = 1;
  state.firstRoundTotal = state.queue.length;
  state.firstRoundKnown = 0;
  state.goodCount = 0;
  state.redoCount = 0;
  $("deckTitle").textContent = topic.he;
  show("view-deck");
  renderCard();
}

function currentCard() { return state.queue[state.idx]; }

function renderCard() {
  const c = currentCard();
  const total = state.queue.length;
  $("deckCounter").textContent = (state.idx + 1) + "/" + total;
  $("progressFill").style.width = (100 * state.idx / total) + "%";
  $("tallyGood").innerHTML = "&#10003; " + state.goodCount;
  $("tallyRedo").innerHTML = "&#8635; " + state.redoCount;

  const flag = $("roundFlag");
  if (state.round > 1) {
    flag.textContent = "סבב חזרה " + (state.round - 1) + " — הכרטיסים שסימנת לחזרה";
    flag.classList.remove("hidden");
  } else {
    flag.classList.add("hidden");
  }

  state.flipped = false;
  $("flip").classList.remove("flipped");

  $("cardTopic").textContent = c._topicHe || state.topic.he;
  $("cardTerm").textContent = c.t;
  $("cardTermBack").textContent = c.t;

  const rows = $("cardRows");
  rows.innerHTML = "";
  const addRow = (cls, label, text) => {
    if (!text) return;
    const div = document.createElement("div");
    div.className = "row " + cls;
    const lbl = document.createElement("span");
    lbl.className = "lbl";
    lbl.textContent = label;
    const txt = document.createElement("div");
    txt.className = "txt";
    txt.textContent = text;
    div.appendChild(lbl);
    div.appendChild(txt);
    rows.appendChild(div);
  };
  addRow("tr", "תרגום", c.tr);
  addRow("num", "Numbers", c.num);
  addRow("def", "Reportable defect", c.def);
  addRow("log", "Logic", c.log);
}

function flipCard() {
  state.flipped = !state.flipped;
  $("flip").classList.toggle("flipped", state.flipped);
}

function answer(known) {
  const c = currentCard();
  if (known) {
    state.goodCount++;
    if (state.round === 1) state.firstRoundKnown++;
  } else {
    state.redoCount++;
    state.reviewPile.push(c);
  }
  state.idx++;
  if (state.idx >= state.queue.length) {
    if (state.reviewPile.length > 0) {
      state.queue = shuffle(state.reviewPile);
      state.reviewPile = [];
      state.idx = 0;
      state.round++;
      renderCard();
    } else {
      finishDeck();
    }
  } else {
    renderCard();
  }
}

function finishDeck() {
  saveScore(state.topic.id, state.firstRoundKnown, state.firstRoundTotal);
  $("endTopicName").textContent = state.topic.he;
  $("endKnown").textContent = state.firstRoundKnown;
  $("endTotal").textContent = "/" + state.firstRoundTotal;
  const reviewRounds = state.round - 1;
  $("endDetail").textContent =
    reviewRounds > 0
      ? "ידעת " + state.firstRoundKnown + " מתוך " + state.firstRoundTotal + " בסבב הראשון, ואחרי " +
        reviewRounds + " סבבי חזרה — הכל ישב. כל הכבוד!"
      : "ידעת הכל מהסיבוב הראשון. מושלם!";
  show("view-end");
}

/* ---------- events ---------- */
$("flipInner").addEventListener("click", flipCard);
$("flipInner").addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipCard(); }
});
$("btnGood").addEventListener("click", () => answer(true));
$("btnRedo").addEventListener("click", () => answer(false));
$("btnBack").addEventListener("click", () => { renderTopics(); show("view-topics"); });
$("btnBack2").addEventListener("click", () => { renderTopics(); show("view-topics"); });
$("btnPick").addEventListener("click", () => { renderTopics(); show("view-topics"); });
$("btnAgain").addEventListener("click", () => startDeck(state.topic));

document.addEventListener("keydown", (e) => {
  if ($("view-deck").classList.contains("hidden")) return;
  if (e.defaultPrevented) return; /* flipInner already handled Space/Enter */
  const tag = e.target && e.target.tagName;
  if (e.key === " ") {
    if (tag === "BUTTON") return; /* let a focused button keep native Space behavior */
    e.preventDefault();
    flipCard();
  } else if (e.key === "1") {
    answer(true);
  } else if (e.key === "2") {
    answer(false);
  }
});

renderTopics();
show("view-topics");
</script>

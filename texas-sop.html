<title>Texas SOP State Exam</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --paper:#F4F7FA; --card:#FFFFFF; --card-2:#FAFCFD;
  --ink:#16202E; --muted:#5B6B7C; --line:#DBE3EB; --line-soft:#EAF0F5;
  --navy:#1F4E79; --navy-soft:#E8F0F8;
  --good:#1B7F46; --good-soft:#E6F4EC;
  --flag:#B23A2C; --flag-soft:#FBEDEB;
  --amber:#B87A10; --amber-soft:#FCF3E2;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 8px 24px -12px rgba(22,32,46,.18);
  --on-accent:#FFFFFF;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D141D; --card:#161F2B; --card-2:#1B2635;
    --ink:#E3EAF2; --muted:#93A4B6; --line:#28374A; --line-soft:#1F2C3C;
    --navy:#6BA6DE; --navy-soft:#17293C;
    --good:#4CC280; --good-soft:#122C1F;
    --flag:#E8776A; --flag-soft:#301A18;
    --amber:#E0A63C; --amber-soft:#2C2313;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    --on-accent:#0D141D;
  }
}
:root[data-theme="dark"]{
  --paper:#0D141D; --card:#161F2B; --card-2:#1B2635;
  --ink:#E3EAF2; --muted:#93A4B6; --line:#28374A; --line-soft:#1F2C3C;
  --navy:#6BA6DE; --navy-soft:#17293C;
  --good:#4CC280; --good-soft:#122C1F;
  --flag:#E8776A; --flag-soft:#301A18;
  --amber:#E0A63C; --amber-soft:#2C2313;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --on-accent:#0D141D;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}

/* ---------- rail ---------- */
.rail{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:10px max(16px,calc(50% - 430px));
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap
}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat u{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  font-family:"IBM Plex Mono",monospace}
.stat b{font-size:15px;font-weight:600;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line-soft);position:sticky;top:53px;z-index:19}
.bar .fill{height:100%;background:var(--navy);width:0;transition:width .25s ease}

/* ---------- layout ---------- */
.wrap{max-width:860px;margin:0 auto;padding:26px max(16px,4vw) 90px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- start screen ---------- */
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.hero p{color:var(--muted);margin:0 0 18px;max-width:62ch}
.modes{display:grid;gap:10px;margin:18px 0}
.mode{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.mode:hover,.mode:focus-visible{border-color:var(--navy);background:var(--navy-soft);outline:none}
.mode i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:none;margin-top:1px}
.mode b{display:block;font-weight:600;font-size:15px}
.mode span{color:var(--muted);font-size:13.5px}
.secs{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px}

/* ---------- question ---------- */
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ix{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em}
.cite{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--navy);
  background:var(--navy-soft);border-radius:5px;padding:2px 7px;margin-left:auto;
  white-space:nowrap;flex:none;align-self:flex-start}
.qtext{font-size:19px;font-weight:600;line-height:1.42;letter-spacing:-.01em;margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--navy);background:var(--navy-soft);outline:none}
.opt:disabled{cursor:default}
.opt u{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--muted);
  text-decoration:none;flex:none;margin-top:2px;min-width:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right u{color:var(--good)}

/* ---------- verdict ---------- */
.verdict{margin-top:16px;border-radius:var(--r);padding:14px 16px;border:1px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good)}
.verdict.no{background:var(--flag-soft);border-color:var(--flag)}
.verdict b{display:block;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
.verdict.ok b{color:var(--good)}
.verdict.no b{color:var(--flag)}
.verdict p{margin:0;font-size:14.5px;line-height:1.55}
.reveal{margin-top:14px;background:var(--good-soft);border:1px solid var(--good);
  border-radius:var(--r);padding:14px 16px}
.reveal b{display:block;color:var(--good);font-size:16px;margin-bottom:5px}
.reveal p{margin:0;font-size:14.5px;line-height:1.55}

/* ---------- controls ---------- */
.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--navy);color:var(--on-accent);border:1px solid var(--navy);border-radius:8px;
  padding:11px 20px;font-weight:600;font-size:14.5px;cursor:pointer;transition:opacity .12s}
.btn:hover,.btn:focus-visible{opacity:.88;outline:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn.good{background:var(--good);border-color:var(--good)}
.btn.flag{background:var(--flag);border-color:var(--flag)}
.btn.ghost{color:var(--ink)}

/* ---------- score ---------- */
.score{text-align:center;padding:12px 0 4px}
.score .pc{font-family:"IBM Plex Mono",monospace;font-size:58px;font-weight:600;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted);font-size:14px;margin-top:8px}
.pass{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;
  border-radius:20px;padding:6px 15px;border:1px solid}
.pass.y{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.pass.n{color:var(--flag);background:var(--flag-soft);border-color:var(--flag)}
table{width:100%;border-collapse:collapse;margin-top:22px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums;width:74px}
.tw{overflow-x:auto}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rev h3{font-size:15px;margin:0 0 4px}
.rev .item{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.rev .item p{margin:0 0 4px;font-size:14.5px;font-weight:600}
.rev .item span{color:var(--good);font-size:14px;font-weight:600}
.rev .item em{display:block;color:var(--muted);font-size:13px;font-style:normal;margin-top:3px}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);
  padding:13px 15px;font-size:13.5px;margin-top:18px}
.note b{color:var(--amber)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .qtext{font-size:17.5px}
  .score .pc{font-size:46px}
  .cite{margin-left:0}
}
</style>

<div class="rail">
  <div class="brand"><b>Texas SOP</b><span>TREC state portion</span></div>
  <div class="stat"><u>Question</u><b id="pos">—</b></div>
  <div class="stat"><u>Right</u><b id="right">0</b></div>
</div>

<script>
const BANK = [
{s:"General provisions",c:"535.227(a)",q:"The Standards of Practice apply when an inspector accepts employment to perform a real estate inspection for:",a:"A prospective buyer or seller",w:["A lender underwriting the mortgage", "A builder verifying his own work", "Any party who pays the inspection fee"],y:"The scope names a prospective buyer or seller. Change the client and the SOP no longer govern the inspection. Lender and builder are the two the exam offers most."},
{s:"General provisions",c:"535.227(a)",q:"The Standards set the minimum requirements for an inspection of a:",a:"One to four family dwelling that is substantially completed",w:["Single family dwelling of any size, complete or not", "Residential or light commercial building under eight units", "One to four family dwelling at any stage of construction"],y:"Three qualifiers, all testable: one to four family, not commercial; substantially completed, not mid-construction; and for a buyer or seller. Break any one and the SOP do not apply."},
{s:"General provisions",c:"535.227",q:"The seven parts of 535.227 run in order. Which comes immediately after General limitations?",a:"Controlling provision",w:["Departure provision", "Enforcement", "General requirements"],y:"Scope, Definitions, General requirements, General limitations, Controlling provision, Departure provision, Enforcement. The order is itself examinable."},
{s:"General provisions",c:"535.227(c)",q:"Under the general requirements, installed equipment and appliances must be operated:",a:"In at least one mode, using ordinary controls at typical settings",w:["In every mode the manufacturer provides", "Only where the client specifically requests it", "In at least two modes, including any energy-saving setting"],y:"At least one mode, ordinary controls, typical settings. Hold the phrase word for word — it recurs in the heating and cooling sections as the boundary of what operating means."},
{s:"General provisions",c:"535.227(c)",q:"The general requirements say you must visually inspect accessible systems:",a:"From near proximity, including from inside the attic and crawl spaces",w:["From ground level and from any permanently installed access", "From near proximity, but never from inside a crawl space", "Using a drone or camera where entry is inconvenient"],y:"Near proximity, and specifically from inside the attic and crawl spaces. That is why two subsections separately require you to report the vantage point you used."},
{s:"General provisions",c:"535.227(c)",q:"Which of the following is a general requirement unique to Texas?",a:"Completing the standard inspection report form promulgated by the Commission",w:["Providing the client with a written cost estimate for repairs", "Photographing every deficiency reported", "Delivering the report within three business days"],y:"The report form is mandatory and promulgated under 535.222 and 535.223. You do not write your own format. Nothing comparable exists on the national exam."},
{s:"General provisions",c:"535.227(d)",q:"An inspector is NOT required to inspect any of the following EXCEPT:",a:"A deck attached to the dwelling",w:["An elevator", "A sub-surface drainage system", "A driveway or sidewalk"],y:"Attached porches, balconies, decks and carports are required under 535.228(j). Only DETACHED decks fall under the general exclusion. Elevators, sub-surface drainage and concrete flatwork are all genuinely excluded."},
{s:"General provisions",c:"535.227(d)",q:"Which is an inspector NOT required to determine?",a:"The presence or absence of wood-destroying insects",w:["The type of foundation", "The vantage point from which the attic was inspected", "Whether a water heater relief valve has discharge piping"],y:"The rule excludes determining the presence or absence of pests, termites and other wood-destroying insects or organisms, and the presence, absence or risk of asbestos, lead-based paint and other environmental hazards."},
{s:"General provisions",c:"535.227(d)",q:"Must you report a past repair that appears effective and workmanlike?",a:"No, unless a specific standard requires it",w:["Yes, every past repair must be reported", "Only if it was done without a permit", "Only if it is less than one year old"],y:"Past repairs that appear effective and workmanlike need not be reported, except where specifically required. The same applies to cosmetic or aesthetic conditions and to wear and tear from ordinary use."},
{s:"General provisions",c:"535.227(d)",q:"Which of these is concrete flatwork, and therefore outside the standard?",a:"A patio and its paving stones",w:["A garage floor slab", "A foundation slab on grade", "A basement floor"],y:"Concrete flatwork means driveways, sidewalks, walkways, paving stones and patios — the slabs that are not part of the building. The dwelling's own floor slabs remain in scope."},
{s:"General provisions",c:"535.227(e)",q:"A general provision conflicts with a specific provision elsewhere in the Standards. Which governs?",a:"The specific provision",w:["The general provision", "Whichever imposes the greater duty on the inspector", "The inspector chooses, and documents the choice"],y:"Specific beats general. One line, and one of the easiest marks in the whole section."},
{s:"General provisions",c:"535.227(f)",q:"Which is NOT a valid ground for departing from inspecting a required component?",a:"The component would take an unreasonable amount of time to inspect",w:["The inspector and the client agree it is not to be inspected", "The inspector is not qualified to inspect it", "Conditions are hazardous to the health or safety of the inspector"],y:"A closed list of three: client agreement, lack of qualification, or conditions that prevent inspection or are hazardous. Time and convenience are not on it. Departure is a limited permission, not a general license to skip things."},
{s:"General provisions",c:"535.227(g)",q:"Failure to comply with the Standards of Practice is grounds for disciplinary action under:",a:"Chapter 1102 of the Occupations Code",w:["22 TAC Chapter 535 alone", "The Texas Deceptive Trade Practices Act", "Chapter 1101 of the Occupations Code"],y:"Enforcement points back to the statute. Chapter 1102 is the Real Estate Inspectors chapter of the Occupations Code; 22 TAC 535 is TREC's rules made under it."},
{s:"Structural systems",c:"535.228(a)",q:"Regarding the foundation, a Texas inspector must:",a:"Render a written opinion as to its performance",w:["Describe its type and condition without opining", "Certify that it meets the code in force when built", "Recommend a structural engineer whenever any crack is present"],y:"The single most distinctive rule in the Texas SOP. The national standard has you describe and report; Texas requires a judgment on performance. It is not an engineering analysis and not a warranty — it is how the foundation appears to be performing on the day, from what you could see."},
{s:"Structural systems",c:"535.228(a) and (d)",q:"Which two subsections require the inspector to report the vantage point from which an area was inspected?",a:"Foundations, and Roof Structures and Attics",w:["Foundations, and Grading and Drainage", "Roof Covering Materials, and Roof Structures and Attics", "Interior Walls, and Porches and Decks"],y:"Crawl space in (a), attic in (d). Texas wants the report to say where you looked from, because that defines what you could actually see."},
{s:"Structural systems",c:"535.228(j)",q:"A deck is attached to the dwelling. Is it within the scope of the inspection?",a:"Yes, under the Porches, Balconies, Decks and Carports subsection",w:["No, decks are excluded by the general limitations", "Only if the client asks for it in writing", "Only if it is more than 30 inches above grade"],y:"The trap that catches people, because the general limitations do exclude decks — but only detached ones. Attached is in, detached is out."},
{s:"Structural systems",c:"535.228",q:"Which subsection of Structural Systems comes immediately after Foundations?",a:"Grading and Drainage",w:["Roof Covering Materials", "Roof Structures and Attics", "Exterior Walls, Doors and Windows"],y:"The order runs Foundations, Grading and Drainage, Roof Covering Materials, Roof Structures and Attics, then interiors, exteriors, glazing, stairways, fireplaces, and porches and decks last."},
{s:"Structural systems",c:"535.228(b)",q:"Under Grading and Drainage, which is outside the standard?",a:"A sub-surface drainage system",w:["Standing water beside the foundation", "Grading that slopes toward the structure", "Surface drainage away from the structure"],y:"Sub-surface drainage is excluded by the general limitations, along with concrete flatwork such as driveways and walkways. Everything visible on the surface is in."},
{s:"Structural systems",c:"535.228(g)",q:"Safety glass questions live in which subsection of Structural Systems?",a:"Exterior and Interior Glazing",w:["Exterior Walls, Doors and Windows", "Interior Walls, Ceilings, Floors and Doors", "Interior and Exterior Stairways"],y:"Glazing has its own subsection, (g), sitting between the walls and doors subsections and stairways. That is where tempered and safety glazing is tested."},
{s:"Structural systems",c:"535.228(h)",q:"Treads, risers, handrails and guards are covered under:",a:"Interior and Exterior Stairways",w:["Interior Walls, Ceilings, Floors and Doors", "Porches, Balconies, Decks and Carports", "Exterior and Interior Glazing"],y:"Stairways is its own subsection, (h). Note that it covers both interior and exterior stairs in one place."},
{s:"Structural systems",c:"535.228(d)",q:"Framing, decking, ventilation and insulation of the roof space are covered under:",a:"Roof Structures and Attics",w:["Roof Covering Materials", "Foundations", "Grading and Drainage"],y:"Covering materials, (c), deals with the material, its condition and its penetrations. Structures and attics, (d), deals with what is underneath — and requires the attic vantage point."},
{s:"Electrical",c:"535.229",q:"Section 535.229 Electrical Systems is divided into:",a:"Service Entrance and Panels, and Branch Circuits, Connected Devices and Fixtures",w:["Service Entrance, Branch Circuits, and Grounding", "Interior wiring and exterior wiring", "Panels, Devices, and General Limitations"],y:"Two subsections only: (a) the service side, (b) everything downstream of it."},
{s:"Electrical",c:"535.229(b)",q:"What does a Texas inspector have to physically do with smoke and carbon monoxide alarms?",a:"Manually test the installed and accessible ones",w:["Report their locations only", "Confirm they are hard-wired and interconnected", "Note their manufacture date and recommend replacement at ten years"],y:"Texas makes you press the button. An affirmative duty, not an option, and one of the clearest departures from the national standard, where alarms are a knowledge question rather than a required action."},
{s:"Electrical",c:"535.229(b)",q:"The rule names the absence of GFCI protection as a deficiency in receptacles in which locations?",a:"Bathroom, garage, outdoor and crawl space",w:["Kitchen, bathroom, laundry and basement", "Bathroom, kitchen, garage and attic", "Any location within six feet of a water source"],y:"Bathroom, garage, outdoor and crawl space. The logic is the one you already know from the national exam: water, or at or below grade."},
{s:"Electrical",c:"535.229(b)",q:"Regarding branch circuits, the inspector shall report:",a:"The type of branch circuit conductors",w:["The calculated load on each circuit", "The manufacturer of the overcurrent devices", "The year the branch wiring was installed"],y:"Report the type of conductors. Anything requiring calculation is outside the standard, in this section and every other."},
{s:"Electrical",c:"535.229(a)",q:"Which is reported as Deficient under Service Entrance and Panels?",a:"A service drop, weatherhead or mast not securely fastened to the building",w:["A service drop that crosses the neighboring property", "A panel manufactured before 1990", "A service rated below 150 amps"],y:"The named deficiencies: the drop, weatherhead or mast not securely fastened; absence of or deficiencies in the grounding electrode system; missing or damaged dead fronts or cover plates; conductors not protected from the edges of cabinets, gutters or cutout boxes; and deficiencies in cabinets, panels, clearances, overcurrent devices, bonding and grounding."},
{s:"Electrical",c:"535.229(a)",q:"A panel is missing its dead front cover. This is:",a:"Reported as Deficient",w:["Reported only if the panel is accessible to children", "Noted but not a deficiency", "Outside the standard, as it is a safety device"],y:"Missing or damaged dead fronts or cover plates are named directly in the rule. The dead front is what stands between a hand and the busbars."},
{s:"HVAC",c:"535.230",q:"Section 535.230 covering heating, ventilation and air conditioning is divided into:",a:"Heating equipment, cooling equipment, duct systems, and general limitations",w:["Heating equipment, cooling equipment, and thermostats", "Gas heating, electric heating, and cooling", "Equipment, distribution, and controls"],y:"Four subsections, and the fourth being its own set of general limitations is worth noticing — HVAC gets extra exclusions on top of the ones in 535.227(d)."},
{s:"HVAC",c:"535.230",q:"Which of these is outside the HVAC standard?",a:"Determining the adequacy or capacity of the system",w:["Operating the heating equipment in one mode", "Reporting the condition of the ductwork", "Reporting deficiencies in the registers"],y:"The recurring boundary across every technical section: operate and observe, yes; calculate, dismantle or determine adequacy, no. If an option asks you to size or rate something, it is outside the standard."},
{s:"HVAC",c:"535.230(c)",q:"The Duct Systems subsection covers:",a:"Distribution, registers, filters and the condition of the ductwork",w:["Duct sizing calculations and static pressure", "Only the visible ductwork in the attic", "Air balancing between rooms"],y:"Distribution, registers, filters, condition. Sizing and balancing are calculations, and calculations are outside every section of this standard."},
{s:"Plumbing",c:"535.231",q:"Which plumbing item has its own subsection under 535.231?",a:"Hydro-massage therapy equipment",w:["Lawn irrigation systems", "Private water wells", "Sump pumps"],y:"Whirlpool and jetted tubs get dedicated treatment because they are a plumbing fixture with an electric motor sitting in water — they straddle two systems. Irrigation and private wells are optional systems under 535.233, not plumbing."},
{s:"Plumbing",c:"535.231(c)",q:"Inspecting hydro-massage therapy equipment includes reporting deficiencies in:",a:"Access to the pump, and the presence of GFCI protection",w:["The water temperature and jet pressure", "The motor's horsepower rating", "The manufacturer's warranty status"],y:"You operate the equipment and report deficiencies, including access to the pump and GFCI protection. Access matters because a pump nobody can reach cannot be serviced."},
{s:"Plumbing",c:"535.231(a)",q:"Underground water supply lines are:",a:"Outside the standard, as buried or concealed items",w:["Inspected by pressure-testing the system", "Inspected only where a cleanout gives access", "Reported as Deficient if their type cannot be determined"],y:"Anything buried, hidden, latent or concealed is excluded by the general limitations, which puts most underground supply and drain lines outside the inspection."},
{s:"Plumbing",c:"535.231(b)",q:"For a water heater, the standard asks you to report:",a:"Deficiencies in the relief valve and its discharge piping",w:["The remaining life expectancy of the tank", "Whether the unit is correctly sized for the dwelling", "The efficiency rating of the burner"],y:"Your national-exam knowledge transfers directly. The difference is the Texas framing: the rule asks what you report as Deficient, not what the correct installation would be. Sizing and efficiency are outside every section."},
{s:"Plumbing",c:"535.231(a)",q:"Every plumbing subsection comes down to three questions. They are:",a:"What type is it, does it operate, and is anything leaking or unsafe",w:["Is it code compliant, is it sized correctly, and how old is it", "Who installed it, when, and under what permit", "What material, what pressure, and what flow rate"],y:"Type, operation, condition. If a question asks you to determine adequacy, sizing, or the condition of anything buried, the answer is that it is outside the standard."},
{s:"Appliances",c:"535.232",q:"A gas appliance connector is reported as Deficient when it:",a:"Exceeds six feet in length, or is concealed within a wall or partition",w:["Exceeds ten feet in length", "Is made of corrugated stainless steel", "Is not fitted with a shutoff valve at the appliance"],y:"Two rules that travel together: longer than six feet, or concealed within or extending through walls, floors, partitions, ceilings or appliance housings. The six-foot rule also appeared on your national practice exams."},
{s:"Appliances",c:"535.232",q:"An oven thermostat is reported as Deficient if it is not within:",a:"25 degrees at a setting of 350 degrees F",w:["10 degrees at a setting of 350 degrees F", "25 degrees at a setting of 400 degrees F", "50 degrees at any setting"],y:"Within 25 degrees at 350. Both numbers matter — the exam will change the setting as readily as the tolerance."},
{s:"Appliances",c:"535.232",q:"What must be tested on a garage door operator?",a:"Operation, auto-reverse and the photoelectric sensors",w:["Operation only", "The height of the wall control above the floor", "The manual release rope height"],y:"A life-safety item, and Texas requires you to test it rather than merely observe it. The 60-inch control height and 72-inch release rope are national-exam facts; the Texas duty is the testing."},
{s:"Appliances",c:"535.232",q:"Which is NOT one of the nine appliance subsections?",a:"Water softeners and filtration equipment",w:["Food Waste Disposers", "Microwave Ovens", "Dryer Exhaust Systems"],y:"The nine: General Provisions, Dishwasher, Food Waste Disposers, Range Hood and Exhaust Systems, Electric or Gas Ranges Cooktops and Ovens, Microwave Ovens, Mechanical Exhaust Systems and Bathroom Heaters, Garage Door Operators, Dryer Exhaust Systems."},
{s:"Appliances",c:"535.232",q:"Which is true of appliances under the Texas Standards?",a:"Texas requires them to be inspected; the national standard largely does not",w:["They are optional systems inspected only by agreement", "Only built-in appliances are covered, and only if under ten years old", "They are inspected but never reported as Deficient"],y:"Nine subsections of required appliance inspection, close to unique to the state exam. Worth disproportionate attention when the whole state portion is 25 questions."},
{s:"Optional systems",c:"535.233",q:"Optional systems such as swimming pools and private wells are inspected:",a:"Only if the inspector agrees to inspect them",w:["Whenever they are present on the property", "Only if the client pays an additional fee", "Only by an inspector holding a separate endorsement"],y:"They are not part of a standard inspection. But once you agree, the rule for that system applies in full — you cannot agree and then inspect casually."},
{s:"Optional systems",c:"535.233",q:"Which of these is an optional system under 535.233?",a:"Outbuildings",w:["Attached carports", "Hydro-massage therapy equipment", "Dryer exhaust systems"],y:"The six optional systems: landscape irrigation, swimming pools and spas, outbuildings, private water wells, private sewage disposal, plus the limitations and scope subsections. Attached carports are structural, and the other two are required sections."},
{s:"Optional systems",c:"535.233(f)",q:"For a private water well, the inspector must report:",a:"The type of pump and storage equipment, and the proximity of any known septic system",w:["The depth of the well and the age of the pump", "The reliability of the water supply", "The results of a bacteriological test"],y:"Report the type of pump and storage equipment and the proximity of any known septic system. You are NOT required to open or remove components, determine the reliability of the supply, or locate underground leaks."},
{s:"Optional systems",c:"535.233(f)",q:"For a private water well, which is reported as Deficient?",a:"Water pressure and flow, and pressure switch performance",w:["The age of the well casing", "The well's yield in gallons per minute", "The distance to the nearest municipal main"],y:"Deficiencies cover water pressure and flow and pressure switch performance, the condition of accessible equipment, and the well head including improper site drainage and clearances."},
{s:"Optional systems",c:"535.233(d)",q:"For a swimming pool or spa, which are you NOT required to determine?",a:"The effectiveness of entrapment covers",w:["The presence of GFCI protection at accessible receptacles", "The condition of the visible decking", "Whether the pump operates"],y:"Expressly excluded: the effectiveness of entrapment covers, the presence of shell or sub-surface leaks, and ancillary equipment such as computer controls, covers, chlorinators and water ionizers."},
{s:"Optional systems",c:"535.233(g)",q:"For a private sewage disposal system, the inspector reports:",a:"The type of system and the location of the drain or distribution field",w:["The capacity of the tank in gallons", "The date the tank was last pumped", "Whether the system meets current county regulations"],y:"Type and location. The pattern holds across every optional system: report the type, report visible deficiencies, and determine nothing that requires digging, dismantling or testing."}
];

const PASS = 0.75;
let mode="exam", order=[], i=0, right=0, answered=[], shown=[];

const $ = s => document.querySelector(s);
const stage = $("#stage");

function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function start(m){
  mode=m; order=shuffle(BANK.map((_,k)=>k)); i=0; right=0; answered=[]; shown=[];
  render();
}

function setRail(){
  $("#pos").textContent = i<order.length ? (i+1)+"/"+order.length : order.length+"/"+order.length;
  $("#right").textContent = right;
  $("#fill").style.width = (i/order.length*100)+"%";
}

function home(){
  const secs=[...new Set(BANK.map(q=>q.s))];
  stage.innerHTML=`
   <div class="hero">
    <div class="eyebrow">TREC STANDARDS OF PRACTICE &middot; 22 TAC 535.227&ndash;535.233</div>
    <h1>Texas SOP</h1>
    <p>${BANK.length} questions on the Standards of Practice half of the state exam — what you must inspect, what you must report as Deficient, and the long list of what you are not required to do. Everything here comes from your five Texas SOP files, checked against trec.texas.gov on 22 August 2026.</p>
    <div class="secs">${secs.map(s=>`<span class="chip">${esc(s)} &middot; ${BANK.filter(q=>q.s===s).length}</span>`).join("")}</div>
    <div class="modes">
      <button class="mode" onclick="start('exam')"><i>A B C</i><span><b>Exam mode</b><span>Multiple choice, like the real thing. The state exam is entirely multiple choice — there is no writing on it.</span></span></button>
      <button class="mode" onclick="start('recall')"><i>&#8212;</i><span><b>Recall mode</b><span>No options. Say the answer out loud, then reveal and mark yourself. Harder than the exam, and the practice your score actually needs.</span></span></button>
    </div>
    <div class="note"><b>Pass mark 75%.</b> You are sitting as a Professional Inspector, so you need ${Math.ceil(BANK.length*PASS)} of ${BANK.length} here. The Real Estate Inspector level passes at 70% — that is not your track.</div>
   </div>`;
  $("#pos").textContent="—"; $("#right").textContent="0"; $("#fill").style.width="0";
}

function render(){
  if(i>=order.length) return results();
  const q=BANK[order[i]];
  setRail();
  if(mode==="exam"){
    const opts=shuffle([q.a,...q.w]);
    shown=opts;
    stage.innerHTML=`
      <div class="qhead"><span class="ix">QUESTION ${i+1}</span><span class="cite mono">${esc(q.c)}</span></div>
      <h2 class="qtext">${esc(q.q)}</h2>
      <div class="opts" id="opts">
        ${opts.map((o,k)=>`<button class="opt" data-k="${k}"><u>${"ABCD"[k]}</u><span>${esc(o)}</span></button>`).join("")}
      </div>
      <div id="after"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k,q));
  } else {
    stage.innerHTML=`
      <div class="qhead"><span class="ix">QUESTION ${i+1}</span><span class="cite mono">${esc(q.c)}</span></div>
      <h2 class="qtext">${esc(q.q)}</h2>
      <p style="color:var(--muted);font-size:14px;margin:0">Say your answer out loud before you reveal it.</p>
      <div class="nav"><button class="btn" onclick="revealNow()">Reveal the answer</button></div>
      <div id="after"></div>`;
  }
}

function answer(k,q){
  const ok = shown[k]===q.a;
  if(ok) right++;
  answered.push({q,ok});
  // Standing rule: the wrong options come off the screen the moment the
  // question is answered, so only the correct one is left to remember.
  const box=$("#opts");
  box.innerHTML=`<button class="opt right" disabled><u>&#10003;</u><span>${esc(q.a)}</span></button>`;
  $("#after").innerHTML=`
    <div class="verdict ${ok?"ok":"no"}">
      <b>${ok?"Correct":"Not this time"}</b>
      <p>${esc(q.y)}</p>
    </div>
    <div class="nav"><button class="btn" id="next">${i+1<order.length?"Next question":"See your score"}</button></div>`;
  $("#next").onclick=()=>{i++;render();};
  $("#next").focus();
  setRail();
}

function revealNow(){
  const q=BANK[order[i]];
  $("#after").innerHTML=`
    <div class="reveal"><b>${esc(q.a)}</b><p>${esc(q.y)}</p></div>
    <div class="nav">
      <button class="btn good" id="got">I had it</button>
      <button class="btn flag" id="miss">I did not</button>
    </div>`;
  $("#got").onclick=()=>{right++;answered.push({q,ok:true});i++;render();};
  $("#miss").onclick=()=>{answered.push({q,ok:false});i++;render();};
  $("#got").focus();
}

function results(){
  const pc=Math.round(right/order.length*100);
  const passed=pc>=PASS*100;
  const secs=[...new Set(BANK.map(q=>q.s))];
  const rows=secs.map(s=>{
    const inSec=answered.filter(a=>a.q.s===s);
    const got=inSec.filter(a=>a.ok).length;
    return `<tr><td>${esc(s)}</td><td class="n">${got}/${inSec.length}</td>
            <td class="n" style="color:${got===inSec.length?"var(--good)":(got/inSec.length<PASS?"var(--flag)":"var(--ink)")}">${inSec.length?Math.round(got/inSec.length*100):0}%</td></tr>`;
  }).join("");
  const missed=answered.filter(a=>!a.ok);
  $("#fill").style.width="100%";
  $("#pos").textContent=order.length+"/"+order.length;
  $("#right").textContent=right;
  stage.innerHTML=`
    <div class="score">
      <div class="eyebrow">${mode==="exam"?"EXAM MODE":"RECALL MODE"}</div>
      <div class="pc" style="color:${passed?"var(--good)":"var(--flag)"}">${pc}%</div>
      <div class="of">${right} right out of ${order.length} &middot; pass mark 75%</div>
      <div class="pass ${passed?"y":"n"}">${passed?"Above the line":"Below the line — "+(Math.ceil(order.length*PASS)-right)+" more needed"}</div>
    </div>
    <div class="tw"><table>
      <tr><th>Section</th><th class="n">Right</th><th class="n">Score</th></tr>
      ${rows}
    </table></div>
    ${missed.length?`<div class="rev"><h3>What to go back over</h3>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">Correct answers only — nothing here shows you what you picked.</p>
      ${missed.map(a=>`<div class="item"><p>${esc(a.q.q)}</p><span>${esc(a.q.a)}</span><em>${esc(a.q.c)} &middot; ${esc(a.q.y)}</em></div>`).join("")}
     </div>`:`<div class="note" style="margin-top:22px"><b>Nothing missed.</b> Run it again in recall mode — producing these cold is a different skill from recognising them.</div>`}
    <div class="nav">
      <button class="btn" onclick="start('${mode}')">Run it again</button>
      <button class="btn ghost" onclick="start('${mode==="exam"?"recall":"exam"}')">Try ${mode==="exam"?"recall":"exam"} mode</button>
      <button class="btn ghost" onclick="home()">Back to the start</button>
    </div>`;
}

home();
</script>

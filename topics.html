<style>
:root{
  --paper:#F4F7FA; --card:#FFFFFF; --card-2:#FAFCFD;
  --ink:#16202E; --muted:#5B6B7C; --line:#DBE3EB; --line-soft:#EAF0F5;
  --navy:#1F4E79; --navy-soft:#E8F0F8;
  --good:#1B7F46; --good-soft:#E6F4EC;
  --flag:#B23A2C; --flag-soft:#FBEDEB;
  --amber:#B87A10; --amber-soft:#FCF3E2;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 8px 24px -12px rgba(22,32,46,.18);
  --on-accent:#FFFFFF;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D141D; --card:#161F2B; --card-2:#1B2635;
    --ink:#E3EAF2; --muted:#93A4B6; --line:#28374A; --line-soft:#1F2C3C;
    --navy:#6BA6DE; --navy-soft:#17293C;
    --good:#4CC280; --good-soft:#122C1F;
    --flag:#E8776A; --flag-soft:#301A18;
    --amber:#E0A63C; --amber-soft:#2C2313;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
    --on-accent:#0D141D;
  }
}
:root[data-theme="dark"]{
  --paper:#0D141D; --card:#161F2B; --card-2:#1B2635;
  --ink:#E3EAF2; --muted:#93A4B6; --line:#28374A; --line-soft:#1F2C3C;
  --navy:#6BA6DE; --navy-soft:#17293C;
  --good:#4CC280; --good-soft:#122C1F;
  --flag:#E8776A; --flag-soft:#301A18;
  --amber:#E0A63C; --amber-soft:#2C2313;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  --on-accent:#0D141D;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2{text-wrap:balance;margin:0}
button{font:inherit;color:inherit}

/* ---------- rail ---------- */
.rail{
  position:sticky;top:0;z-index:20;background:var(--card);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;
  padding:10px max(16px,calc(50% - 430px));
}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto;min-width:0}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap
}
.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.stat u{font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-decoration:none;
  font-family:"IBM Plex Mono",monospace}
.stat b{font-size:15px;font-weight:600;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line-soft);position:sticky;top:53px;z-index:19}
.bar .fill{height:100%;background:var(--navy);width:0;transition:width .25s ease}

/* ---------- layout ---------- */
.wrap{max-width:860px;margin:0 auto;padding:26px max(16px,4vw) 90px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:22px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- start screen ---------- */
.hero h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.hero p{color:var(--muted);margin:0 0 18px;max-width:62ch}
.modes{display:grid;gap:10px;margin:18px 0}
.mode{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.mode:hover,.mode:focus-visible{border-color:var(--navy);background:var(--navy-soft);outline:none}
.mode i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:3px 7px;flex:none;margin-top:1px}
.mode b{display:block;font-weight:600;font-size:15px}
.mode span{color:var(--muted);font-size:13.5px}
.secs{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  background:var(--card-2);border:1px solid var(--line);border-radius:20px;padding:4px 10px}

/* ---------- question ---------- */
.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ix{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:.06em}
.cite{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--navy);
  background:var(--navy-soft);border-radius:5px;padding:2px 7px;margin-left:auto;
  white-space:nowrap;flex:none;align-self:flex-start}
.qtext{font-size:19px;font-weight:600;line-height:1.42;letter-spacing:-.01em;margin:0 0 16px}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--navy);background:var(--navy-soft);outline:none}
.opt:disabled{cursor:default}
.opt u{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--muted);
  text-decoration:none;flex:none;margin-top:2px;min-width:14px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right u{color:var(--good)}

/* ---------- verdict ---------- */
.verdict{margin-top:16px;border-radius:var(--r);padding:14px 16px;border:1px solid}
.verdict.ok{background:var(--good-soft);border-color:var(--good)}
.verdict.no{background:var(--flag-soft);border-color:var(--flag)}
.verdict b{display:block;font-size:13px;letter-spacing:.02em;margin-bottom:5px}
.verdict.ok b{color:var(--good)}
.verdict.no b{color:var(--flag)}
.verdict p{margin:0;font-size:14.5px;line-height:1.55}
.reveal{margin-top:14px;background:var(--good-soft);border:1px solid var(--good);
  border-radius:var(--r);padding:14px 16px}
.reveal b{display:block;color:var(--good);font-size:16px;margin-bottom:5px}
.reveal p{margin:0;font-size:14.5px;line-height:1.55}

/* ---------- controls ---------- */
.nav{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{background:var(--navy);color:var(--on-accent);border:1px solid var(--navy);border-radius:8px;
  padding:11px 20px;font-weight:600;font-size:14.5px;cursor:pointer;transition:opacity .12s}
.btn:hover,.btn:focus-visible{opacity:.88;outline:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy);color:var(--navy)}
.btn.good{background:var(--good);border-color:var(--good)}
.btn.flag{background:var(--flag);border-color:var(--flag)}
.btn.ghost{color:var(--ink)}

/* ---------- score ---------- */
.score{text-align:center;padding:12px 0 4px}
.score .pc{font-family:"IBM Plex Mono",monospace;font-size:58px;font-weight:600;line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .of{color:var(--muted);font-size:14px;margin-top:8px}
.pass{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;
  border-radius:20px;padding:6px 15px;border:1px solid}
.pass.y{color:var(--good);background:var(--good-soft);border-color:var(--good)}
.pass.n{color:var(--flag);background:var(--flag-soft);border-color:var(--flag)}
table{width:100%;border-collapse:collapse;margin-top:22px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line-soft)}
th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums;width:74px}
.tw{overflow-x:auto}
.rev{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rev h3{font-size:15px;margin:0 0 4px}
.rev .item{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.rev .item p{margin:0 0 4px;font-size:14.5px;font-weight:600}
.rev .item span{color:var(--good);font-size:14px;font-weight:600}
.rev .item em{display:block;color:var(--muted);font-size:13px;font-style:normal;margin-top:3px}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:var(--r);
  padding:13px 15px;font-size:13.5px;margin-top:18px}
.note b{color:var(--amber)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){
  .qtext{font-size:17.5px}
  .score .pc{font-size:46px}
  .cite{margin-left:0}
}
</style>
<style>
.tlist{display:grid;gap:8px;margin:18px 0}
.tcard{display:flex;gap:13px;align-items:center;text-align:left;width:100%;
  background:var(--card-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;cursor:pointer;transition:border-color .12s,background .12s}
.tcard:hover,.tcard:focus-visible{border-color:var(--navy);background:var(--navy-soft);outline:none}
.tcard i{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--muted);flex:none;min-width:20px}
.tcard b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.tcard em{font-style:normal;color:var(--muted);font-size:12.5px;
  font-family:"IBM Plex Mono",monospace}
.tcard .g{margin-left:auto;flex:none;text-align:right}
.tcard .g u{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;
  font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.tcard .g em{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.weak u{color:var(--flag)}
.unmeasured u{color:var(--amber)}
</style>

nswer was a term every single time."},{"s":"Terms","c":"definition","q":"The bottom horizontal member of a stud wall, sitting on the subfloor or the slab. This is known as:","a":"Sole plate","w":["Sill","Header","Bonding strength"],"y":"A definition question always wants the plain term. “Is known as” and “is called” appeared 45 times across the measured question set and the answer was a term every single time."},{"s":"Terms","c":"definition","q":"What is used to help support the wall and its load when an opening is made in a load-bearing wood framed wall. This is known as:","a":"Header","w":["Sole plate","Rough opening","Sill"],"y":"A definition question always wants the plain term. “Is known as” and “is called” appeared 45 times across the measured question set and the answer was a term every single time."},{"s":"Terms","c":"definition","q":"The measurement between the inside faces of the trimmers for a door. This is known as:","a":"Rough opening","w":["Header","Sole plate","Sill"],"y":"A definition question always wants the plain term. “Is known as” and “is called” appeared 45 times across the measured question set and the answer was a term every single time."},{"s":"My mistakes","c":"missed 3×","q":"Lumber that has been planned on all sides is called ______.","a":"S4S","w":[],"y":"S4S means the lumber has been surfaced on all four sides."},{"s":"My mistakes","c":"missed 2×","q":"Another name for \"rebar\" is:","a":"Deformed bars","w":[],"y":"The ridges in deformed bars help to \"grab\" the concrete."},{"s":"My mistakes","c":"missed 2×","q":"Foundation anchor bolts shall extend a minimum of ____ inches into concrete or grouted cells of masonry units.","a":"Seven.","w":[],"y":"The anchor bolts hold the house to the foundation and should extend a minimum of seven inches into concrete or grouted cells of masonry units."},{"s":"My mistakes","c":"missed 2×","q":"In combustible construction, what is the maximum horizontal measurement allowed in a concealed wall space (between fire-blocking)?","a":"10 feet.","w":[],"y":"Between fire-blocking in a concealed wall space, the maximum horizontal measurement is 10 feet."},{"s":"My mistakes","c":"missed 2×","q":"The actual size of an 8 x 8 x 16 masonry block is?","a":"7.625\" X 7.625\" X 15.625\"","w":[],"y":"The actual size of an 8\" x 8\" x 16\" masonry block is 3/8\" less than stated numbers."},{"s":"My mistakes","c":"missed 2×","q":"The maximum notch allowed in non-bearing wall studs is ______.","a":"40%","w":[],"y":"A non-bearing wall wood stud cannot be notched more than 40%."},{"s":"My mistakes","c":"missed 2×","q":"Truss uplift is typically caused by:","a":"Differential humidity conditions in the attic.","w":[],"y":"Truss uplift is caused by differential humidity conditions in an attic between the bottom and top truss chords."},{"s":"My mistakes","c":"missed 2×","q":"Wood sole plates need to be anchored to foundation walls with _______ anchor bolts.","a":"Half inch.","w":[],"y":"The building code requires half-inch thick anchor bolts."},{"s":"My mistakes","c":"missed once","q":"Dimensional lumbar (framing lumber) is sold by the ____________.","a":"Board foot.","w":[],"y":"A board foot measures 12\" X 12\" X 1.\""},{"s":"My mistakes","c":"missed once","q":"Notches in solid lumber joists, rafters, and beams should not be located:","a":"In the middle third of the span.","w":[],"y":"Notches should not be located in the middle one-third of the span. However, notches of certain amounts can be located in the outer one-third of the span."},{"s":"My mistakes","c":"missed once","q":"The 2 X 4 or 2 X 6 framing member placed horizontally on the concrete foundation and bolted down is the:","a":"Sill.","w":[],"y":"The sill plate, also known as the \"mudsill,\" sits horizontally on the top of a concrete or masonry foundation wall."},{"s":"My mistakes","c":"missed once","q":"The measurement between the inside faces of the trimmers for a door is called what?","a":"The rough opening.","w":[],"y":"The measurement between the inside faces of the trimmers for a door is called the rough opening. It is located between the trimmers."},{"s":"My mistakes","c":"missed once","q":"The rough framed opening for attic access shall not be less than _____ X _____.","a":"22 X 30 inches.","w":[],"y":"This attic access opening is required when the attic exceeds 30 square feet and has a vertical height of 30 inches. The vertical height shall be measured from the top of the ceiling framing members to the underside of the roof framing members."},{"s":"My mistakes","c":"missed once","q":"There shall be a minimum of two anchor bolts per plate section with one bolt located not more than ______ inches or less from each end of the plate section.","a":"Twelve.","w":[],"y":"Foundation wall sill anchor bolts need to be within 12\" of the foundation corners or ends of sill plates."},{"s":"My mistakes","c":"missed once","q":"What is the most important property for mortar?","a":"Bonding strength","w":[],"y":"Bonding strength is the most important property for mortar."},{"s":"My mistakes","c":"missed once","q":"When an opening is made in a load-bearing wood framed wall, a _________ is used to help support the wall and its load.","a":"Header.","w":[],"y":"A header is installed above the door or window opening to transfer loads."}]},{"n":"05","name":"Electrical","weight":7,"acc":64,"qs":[{"s":"Exam questions","c":"drill","q":"The maximum breaker rating must not exceed the allowed ampacity of the:","a":"Conductor","w":["Appliance being served","Service panel","Grounding electrode"],"y":"The breaker protects the wire, not the appliance. A 20-amp breaker on 14-gauge wire rated 15 amps lets the wire overheat before the breaker ever trips."},{"s":"Exam questions","c":"drill","q":"A live wire is sometimes referred to as a:","a":"Ungrounded conductor","w":["Grounded conductor","Grounding conductor","Bonding jumper"],"y":"Ungrounded = hot. Grounded conductor is the neutral; grounding conductor is the safety ground. Three near-identical phrases the exam relies on you confusing."},{"s":"Exam questions","c":"drill","q":"A circuit breaker protects against too much:","a":"Current","w":["Voltage","Resistance","Wattage"],"y":"The breaker watches amps, because current is what heats a wire past its rating and starts a fire."},{"s":"Exam questions","c":"drill","q":"The flow of electrons along a conductor, such as copper wire, is defined as:","a":"Electric current","w":["Voltage","Resistance","Capacitance"],"y":"Volts push, amps flow, ohms resist. 'Is defined as' signals a plain term."},{"s":"Exam questions","c":"drill","q":"_____ is the amount of current or electricity flowing through the wire.","a":"Amperage","w":["Voltage","Wattage","Resistance"],"y":"Amperage is quantity of flow; voltage is the pressure pushing it."},{"s":"Exam questions","c":"drill","q":"A ______ branch circuit is a three-wire circuit with two hot wires and one neutral.","a":"Multiwire","w":["Dedicated","Home run","Split-bus"],"y":"Two hot legs sharing one neutral. They must sit on opposite phases or the shared neutral carries the sum of both loads."},{"s":"Exam questions","c":"drill","q":"The hot side of a polarized receptacle is:","a":"The narrow slot","w":["The wide slot","The round opening","The upper slot"],"y":"Narrow is hot, wide is neutral, round is ground. Reversed polarity is one of the commonest findings on an inspection."},{"s":"Exam questions","c":"drill","q":"The grounding electrode system:","a":"Provides an alternate return path for electricity","w":["Limits the current drawn by an appliance","Reduces voltage drop on long runs","Prevents arcing inside the panel"],"y":"It gives fault current somewhere to go other than through a person."},{"s":"Exam questions","c":"drill","q":"Which is designed to ensure continuity of the fault path, carry fault current safely, and help the overcurrent device operate?","a":"Bonding","w":["Grounding to earth","Polarization","Arc-fault protection"],"y":"The third clause is the giveaway: grounding to earth does not trip breakers, bonding does."},{"s":"Exam questions","c":"drill","q":"Bonding of appliances in a home can be confirmed using a(n):","a":"Ohmmeter","w":["Ammeter","Voltmeter","Megohmmeter"],"y":"Bonding is continuity, and continuity means low resistance. Match the instrument to the quantity."},{"s":"Exam questions","c":"drill","q":"GFCI protection:","a":"Operates by sensing current imbalances within the circuit","w":["Operates by sensing excess current on the hot leg","Requires an equipment ground to function","Protects the wiring rather than people"],"y":"It compares what leaves on the hot with what returns on the neutral. A GFCI protects people; a breaker protects wires."},{"s":"Exam questions","c":"drill","q":"An ungrounded outlet can be replaced by a GFCI installed:","a":"Upstream of the outlet","w":["Downstream of the outlet","Only at the service panel","Only if a ground wire is added first"],"y":"A GFCI does not need a ground to work, so installed upstream it protects everything downstream. Label it 'No Equipment Ground'."},{"s":"Exam questions","c":"drill","q":"The primary criterion for inlet service capacity is the:","a":"Size of the inlet service wire","w":["Rating of the main breaker","Number of panel spaces","Total connected load of the house"],"y":"The service is rated by what the wire can carry. Same principle as the branch-circuit rule."},{"s":"Exam questions","c":"drill","q":"Electric service drop wires should be at least ______ above the pool water.","a":"22 1/2 feet","w":["10 feet","12 feet","18 feet"],"y":"22.5 feet vertical and 10 feet horizontal. High enough that a pool skimmer pole cannot reach it."},{"s":"Exam questions","c":"drill","q":"All metal within ______ horizontally of the pool water must be bonded to the pool grid.","a":"Five feet","w":["Three feet","Ten feet","Twelve feet"],"y":"Five horizontal, twelve vertical. Everything conductive in that envelope joins one grid so there is no voltage difference to bridge."},{"s":"Exam questions","c":"drill","q":"Most electric water heaters are served by a dedicated 240 volt, ______ amp circuit.","a":"30 amp","w":["20 amp","40 amp","50 amp"],"y":"15 and 20 for general circuits, 30 for water heater and dryer, 40 to 50 for the range."},{"s":"Exam questions","c":"drill","q":"Which aluminum wire installation is most likely to overheat?","a":"A receptacle serving an electric heater","w":["The main service entrance conductors","A ceiling light fixture","A smoke alarm circuit"],"y":"Aluminium creeps under load so connections loosen. The worst case is a heavy continuous load on a small branch-circuit connection."},{"s":"Exam questions","c":"drill","q":"An antioxidant must be applied to all ______ conductors.","a":"AL (aluminum)","w":["CU (copper)","Tinned copper","Copper-clad aluminum"],"y":"Aluminium oxide is a poor conductor, so the joint heats. Antioxidant paste keeps air off the connection."},{"s":"Exam questions","c":"drill","q":"Which statement about knob and tube wiring is FALSE?","a":"The outlet receptacles are grounded","w":["It has no equipment grounding conductor","It must not be buried in insulation","The conductors run separately through porcelain tubes"],"y":"Knob and tube has no ground conductor at all. It also relies on open air to cool, which is why insulation over it is a defect."},{"s":"Exam questions","c":"drill","q":"A(n) ______ rated recessed light fixture may contact insulation.","a":"IC","w":["AFCI","Type NM","UL-2"],"y":"IC means Insulation Contact. A non-IC fixture must stay 3 inches clear because it sheds heat into the air around it."},{"s":"Exam questions","c":"drill","q":"What type of cable is listed for direct burial?","a":"UF","w":["NM","BX","MC"],"y":"UF is Underground Feeder. Its insulation is moulded solid around the conductors so moisture cannot travel inside."},{"s":"Exam questions","c":"drill","q":"Which is TRUE regarding BX cable?","a":"It is in a metallic enclosure","w":["It is rated for direct burial","It contains an insulated grounding conductor","It may be used outdoors without a raceway"],"y":"BX is armoured cable. In older installations the sheath itself was the grounding path, so a rusted sheath is a real defect."},{"s":"Exam questions","c":"drill","q":"Receptacles in habitable rooms must be spaced so no point along the wall is more than ______ from one.","a":"Six feet","w":["Four feet","Eight feet","Twelve feet"],"y":"The 6-foot rule puts receptacles at most 12 feet apart, so a standard cord reaches from anywhere. Its purpose is removing the excuse for extension cords."},{"s":"Exam questions","c":"drill","q":"A three-way switch is required for stairs with ______ or more risers.","a":"Six","w":["Three","Four","Eight"],"y":"Six risers means the stair light must switch from both top and bottom. One of three 'six' answers in Electrical."},{"s":"Exam questions","c":"drill","q":"The maximum permitted number of hand movements to disconnect all house electrical equipment is:","a":"Six","w":["One","Three","Four"],"y":"The six-throw rule. There is no requirement for a single main disconnect so long as six or fewer throws will kill everything."},{"s":"Exam questions","c":"drill","q":"An electrical system with a fuse on both the hot and the neutral conductor:","a":"Is a safety hazard that needs to be corrected","w":["Is acceptable on older installations","Is required on ungrounded systems","Is acceptable if both fuses are the same rating"],"y":"If the neutral fuse blows the circuit stops working but the hot stays live. Never interrupt a grounded conductor."},{"s":"Exam questions","c":"drill","q":"In the service box, the ungrounded service entrance wires connect to:","a":"The 'line' side of the main switch","w":["The 'load' side of the main switch","The neutral bus","The grounding electrode conductor"],"y":"Line is incoming, load is outgoing. Line-side conductors stay live even with the main switched off."},{"s":"Numbers","c":"Current, Pre n air further downstream from where the exhaust air duct connects to the return duct."},{"s":"My mistakes","c":"missed 2×","q":"What type of ducted HRV or ERV configuration uses exhaust ducts connected to grilles in bathrooms, kitchens, and utility rooms to remove pollutants and provide outside ventilation air to the living areas through the HVAC return duct?","a":"Partially ducted.","w":[],"y":"The partially ducted system provides outside ventilation air to the living areas through the HVAC return duct."},{"s":"My mistakes","c":"missed 2×","q":"What type of fan should NOT be used in the winter when a combustion appliance draws combustion air from inside the house?","a":"Whole house fan.","w":[],"y":"A whole house fan is not recommended in the winter especially when a gas appliance such as a furnace is running."},{"s":"My mistakes","c":"missed once","q":"An interior ceiling paddle fan in a bathroom needs to be installed eight feet above the floor of a shower and _______ inches to the side of the shower.","a":"36.","w":[],"y":"An interior ceiling paddle fan needs to be installed 36 inches to the side of the shower due to a possible electrocution hazard."},{"s":"My mistakes","c":"missed once","q":"Installing extra ventilation in an attic can have what effect?","a":"It can cause negative pressure in the attic.","w":[],"y":"Installing extra ventilation in an attic can cause negative pressure in the attic that promotes warm, moist air to enter at a faster rate."},{"s":"My mistakes","c":"missed once","q":"What recovery mechanical ventilation system requires a condensate disposal system?","a":"HRV.","w":[],"y":"Heat recovery ventilators or HRVs remove condensate and as such, require a condensate disposal system."},{"s":"My mistakes","c":"missed once","q":"Where a roof slope is less than 2:12 or there is a cathedral roof with no attic space, the recommended vent area is ______ of the roof area.","a":"1/150","w":[],"y":"Flat roofs usually have ventilation on opposing sides t e pressure to admit air and closes to block sewer gas is a(n):","a":"Air admittance valve","w":["Backwater valve","Trap primer","Vacuum breaker"],"y":"Often called by the brand name Studor. It only works for incoming air, so it can never replace the main roof vent."},{"s":"Exam questions","c":"drill","q":"A vent serving fixtures from as many as two bathrooms on the same floor is a:","a":"Wet vent","w":["Circuit vent","Loop vent","Common vent"],"y":"A pipe doing two jobs: carrying drainage from one fixture while venting another. Limited to the same floor and two bathroom groups."},{"s":"Exam questions","c":"drill","q":"A trap primer:","a":"Requires an air gap","w":["Requires a check valve only","Must be vented separately","Must discharge to the exterior"],"y":"It is fed from the potable supply, so a physical air gap prevents drain water siphoning back into drinking water."},{"s":"Exam questions","c":"drill","q":"Plumbing vents must extend at least ______ above the roof.","a":"Six inches","w":["Three inches","Twelve inches","Twenty-four inches"],"y":"Six inches, or higher where snow accumulates. A blocked vent stops the system breathing and traps siphon dry."},{"s":"Exam questions","c":"drill","q":"A temperature and pressure relief valve must discharge at a temperature not higher than:","a":"210 degrees F","w":["120 degrees F","140 degrees F","180 degrees F"],"y":"210 is the SAFETY limit, because water flashes to steam at 212. Do not confuse it with the 120 thermostat setting."},{"s":"Exam questions","c":"drill","q":"To prevent scalding, water heater tanks should be set at no more than:","a":"120 degrees F","w":["110 degrees F","140 degrees F","210 degrees F"],"y":"120 is the COMFORT setting on the dial. 210 is the valve that saves the tank; 120 is the dial that saves the person."},{"s":"Exam questions","c":"drill","q":"The component introducing cold water near the bottom of a water heater tank is the:","a":"Dip tube","w":["Anode rod","Sacrificial sleeve","Draw tube"],"y":"Cold enters at the top but must be delivered to the bottom so it does not cool the hot water waiting above."},{"s":"Exam questions","c":"drill","q":"The most likely sign that the lower element of an electric water heater has failed is:","a":"Some hot water at first, then warm water at all locations","w":["No hot water at all","Hot water at one fixture only","Hot water that is too hot at every fixture"],"y":"The upper element still heats the top of the tank, so the first draw is hot. 'At all locations' rules out a single-fixture problem."},{"s":"Exam questions","c":"drill","q":"The reaction of copper in direct contact with galvanized piping is called:","a":"Electrolysis","w":["Oxidation","Cavitation","Chelation"],"y":"Two dissimilar metals in water form a small battery and the less noble metal corrodes. The fix is a dielectric union."},{"s":"Exam questions","c":"drill","q":"The problem with older galvanized steel pipes is that they:","a":"Rust internally, narrowing the diameter","w":["Leak at every threaded joint","Become brittle and crack","Leach zinc into the water"],"y":"The failure is invisible from outside. The symptom is falling flow, not a leak."},{"s":"Exam questions","c":"drill","q":"A valve that can either adjust or stop the flow of water is a:","a":"Globe valve","w":["Gate valve","Ball valve","Check valve"],"y":"A globe valve throttles and is built to sit part-open. A gate valve is meant to be fully open or fully shut."},{"s":"Exam questions","c":"drill","q":"The minimum size water line at entry to the home is:","a":"Three-quarters inch","w":["One-half inch","One inch","One and one-quarter inch"],"y":"3/4 inch at the service entry so several fixtures can run at once. Interior branches step down to 1/2 inch."},{"s":"Exam questions","c":"drill","q":"Gas water heaters will NOT have:","a":"A barometric damper","w":["A draft hood","A dip tube","A T&P relief valve"],"y":"A barometric damper belongs to oil-fired equipment. A gas water heater uses a draft ho           <span><b>${esc(t.name)}</b><em>${t.qs.length} questions${t.weight?" &middot; "+t.weight+"% of the exam":""}</em></span>
          <span class="g"><u>${sc}</u><em>${lab}</em></span>
        </button>`;}).join("")}
    </div>
    <div class="note"><b>Red is where the marks are.</b> The percentage is your measured accuracy on
    that topic. Electrical at 64% and Cooling at 60% are worth more than anything you are already
    good at. Life Safety and Mechanical Exhaust show no score because nothing has ever tested you
    on them.</div>
   </div>`;
}

function pick(k){
  T=TOPICS[k];
  $("#brand").textContent=T.name;
  $("#rail").textContent=(T.weight?T.weight+"% of the exam":"national exam");
  const c={};
  T.qs.forEach(q=>c[q.s]=(c[q.s]||0)+1);
  const mc=T.qs.filter(q=>q.w.length===3).length;
  const miss=c["My mistakes"]||0;
  stage.innerHTML=`
   <div class="hero">
    <div class="eyebrow">TOPIC ${T.n} &middot; ${esc(T.name).toUpperCase()}</div>
    <h1>${esc(T.name)}</h1>
    <p>${T.qs.length} questions, all of them from this topic and no other.</p>
    <div class="secs">${Object.keys(c).map(s=>`<span class="chip">${esc(s)} &middot; ${c[s]}</span>`).join("")}</div>
    <div class="modes">
      ${mc?`<button class="mode" onclick="start('exam')"><i>A B C</i><span><b>Exam mode</b><span>${mc} multiple choice questions. Your recorded mistakes sit out of this one, because a review only ever recorded the right answer &mdash; inventing wrong options for them gives the answer away.</span></span></button>`:""}
      <button class="mode" onclick="start('recall')"><i>&#8212;</i><span><b>Recall mode</b><span>All ${T.qs.length}, no options. Say the answer out loud, reveal, mark yourself. Harder than the exam, and the practice your plateau actually needs.</span></span></button>
      ${miss?`<button class="mode" onclick="start('miss')"><i>&#9873;</i><span><b>My mistakes only</b><span>The ${miss} questions you have got wrong in this topic, most-repeated first.</span></span></button>`:""}
    </div>
    <div class="nav"><button class="btn ghost" onclick="home()">All topics</button></div>
   </div>`;
  $("#pos").textContent="\u2014"; $("#right").textContent="0"; $("#fill").style.width="0";
}

function start(m){
  mode=m; right=0; i=0; answered=[]; shown=[];
  let ix=T.qs.map((q,k)=>k);
  if(m==="exam") ix=ix.filter(k=>T.qs[k].w.length===3);
  if(m==="miss") ix=ix.filter(k=>T.qs[k].s==="My mistakes");
  order = m==="miss" ? ix : shuffle(ix);
  render();
}

function setRail(){
  $("#pos").textContent=(i<order.length?i+1:order.length)+"/"+order.length;
  $("#right").textContent=right;
  $("#fill").style.width=(i/order.length*100)+"%";
}

function render(){
  if(i>=order.length) return results();
  const q=T.qs[order[i]];
  setRail();
  const head=`<div class="qhead"><span class="ix">QUESTION ${i+1}</span>
    ${q.c?`<span class="cite mono">${esc(q.c)}</span>`:""}</div>
    <h2 class="qtext">${esc(q.q)}</h2>`;
  if(mode==="exam" && q.w.length===3){
    shown=shuffle([q.a,...q.w]);
    stage.innerHTML=head+`<div class="opts" id="opts">${shown.map((o,k)=>
      `<button class="opt" data-k="${k}"><u>${"ABCD"[k]}</u><span>${esc(o)}</span></button>`).join("")}
      </div><div id="after"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k,q));
  } else {
    stage.innerHTML=head+`
      <p style="color:var(--muted);font-size:14px;margin:0">Say your answer out loud before you reveal it.</p>
      <div class="nav"><button class="btn" onclick="revealNow()">Reveal the answer</button></div>
      <div id="after"></div>`;
  }
}

function answer(k,q){
  const ok=shown[k]===q.a;
  if(ok) right++;
  answered.push({q,ok});
  // The wrong options come off the screen the moment the question is
  // answered, so only the correct one is left to remember.
  $("#opts").innerHTML=`<button class="opt right" disabled><u>&#10003;</u><span>${esc(q.a)}</span></button>`;
  $("#after").innerHTML=`
    <div class="verdict ${ok?"ok":"no"}"><b>${ok?"Correct":"Not this time"}</b>
      ${q.y?`<p>${esc(q.y)}</p>`:""}</div>
    <div class="nav"><button class="btn" id="next">${i+1<order.length?"Next question":"See your score"}</button></div>`;
  $("#next").onclick=()=>{i++;render();};
  $("#next").focus();
  setRail();
}

function revealNow(){
  const q=T.qs[order[i]];
  $("#after").innerHTML=`
    <div class="reveal"><b>${esc(q.a)}</b>${q.y?`<p>${esc(q.y)}</p>`:""}</div>
    <div class="nav"><button class="btn good" id="got">I had it</button>
      <button class="btn flag" id="miss">I did not</button></div>`;
  $("#got").onclick=()=>{right++;answered.push({q,ok:true});i++;render();};
  $("#miss").onclick=()=>{answered.push({q,ok:false});i++;render();};
  $("#got").focus();
}

function results(){
  const pc=Math.round(right/order.length*100), passed=pc>=PASS*100;
  const secs=[...new Set(answered.map(a=>a.q.s))];
  const rows=secs.map(s=>{
    const inSec=answered.filter(a=>a.q.s===s), got=inSec.filter(a=>a.ok).length;
    const p=Math.round(got/inSec.length*100);
    return `<tr><td>${esc(s)}</td><td class="n">${got}/${inSec.length}</td>
      <td class="n" style="color:${p===100?"var(--good)":(p<75?"var(--flag)":"var(--ink)")}">${p}%</td></tr>`;
  }).join("");
  const missed=answered.filter(a=>!a.ok);
  $("#fill").style.width="100%"; $("#pos").textContent=order.length+"/"+order.length;
  $("#right").textContent=right;
  stage.innerHTML=`
    <div class="score">
      <div class="eyebrow">${esc(T.name).toUpperCase()} &middot; ${mode==="exam"?"EXAM":(mode==="miss"?"MY MISTAKES":"RECALL")}</div>
      <div class="pc" style="color:${passed?"var(--good)":"var(--flag)"}">${pc}%</div>
      <div class="of">${right} right out of ${order.length}</div>
      <div class="pass ${passed?"y":"n"}">${passed?"Above 75%":"Below 75% \u2014 "+(Math.ceil(order.length*PASS)-right)+" more needed"}</div>
    </div>
    <div class="tw"><table><tr><th>Where</th><th class="n">Right</th><th class="n">Score</th></tr>${rows}</table></div>
    ${missed.length?`<div class="rev"><h3>What to go back over</h3>
      <p style="color:var(--muted);font-size:13.5px;margin:0 0 6px">Correct answers only &mdash; nothing here shows you what you picked.</p>
      ${missed.map(a=>`<div class="item"><p>${esc(a.q.q)}</p><span>${esc(a.q.a)}</span>
        ${a.q.y?`<em>${esc(a.q.y)}</em>`:""}</div>`).join("")}</div>`
      :`<div class="note" style="margin-top:22px"><b>Nothing missed.</b> Run it in recall mode &mdash; producing these cold is a different skill from recognising them.</div>`}
    <div class="nav">
      <button class="btn" onclick="start('${mode}')">Run it again</button>
      <button class="btn ghost" onclick="pick(TOPICS.indexOf(T))">This topic</button>
      <button class="btn ghost" onclick="home()">All topics</button>
    </div>`;
}

home();
</script>

<meta charset="utf-8">
<title>Texas State Exam Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#F4F7FA; --card:#FFFFFF; --card-2:#FAFCFD; --sunk:#EFF4F8;
  --ink:#16202E; --muted:#5B6B7C; --faint:#8A9AAB;
  --line:#DBE3EB; --line-soft:#EAF0F5;
  --navy:#1F4E79; --navy-soft:#E8F0F8; --navy-line:#B9D2E8;
  --good:#1B7F46; --good-soft:#E6F4EC; --good-line:#A9D8BE;
  --bad:#B23A2C;  --bad-soft:#FBEDEB;  --bad-line:#EEBDB6;
  --amber:#B87A10; --amber-soft:#FCF3E2; --amber-line:#E7CF9A;
  --on-accent:#FFFFFF;
  --shadow:0 1px 2px rgba(22,32,46,.05),0 8px 24px -14px rgba(22,32,46,.22);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D141D; --card:#161F2B; --card-2:#1B2635; --sunk:#111925;
    --ink:#E3EAF2; --muted:#93A4B6; --faint:#6F8095;
    --line:#28374A; --line-soft:#1F2C3C;
    --navy:#6BA6DE; --navy-soft:#17293C; --navy-line:#2C4F71;
    --good:#4CC280; --good-soft:#122C1F; --good-line:#245C3C;
    --bad:#E8776A;  --bad-soft:#301A18;  --bad-line:#5E2E28;
    --amber:#E0A63C; --amber-soft:#2C2313; --amber-line:#5A4620;
    --on-accent:#0D141D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --paper:#0D141D; --card:#161F2B; --card-2:#1B2635; --sunk:#111925;
  --ink:#E3EAF2; --muted:#93A4B6; --faint:#6F8095;
  --line:#28374A; --line-soft:#1F2C3C;
  --navy:#6BA6DE; --navy-soft:#17293C; --navy-line:#2C4F71;
  --good:#4CC280; --good-soft:#122C1F; --good-line:#245C3C;
  --bad:#E8776A;  --bad-soft:#301A18;  --bad-line:#5E2E28;
  --amber:#E0A63C; --amber-soft:#2C2313; --amber-line:#5A4620;
  --on-accent:#0D141D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -16px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  direction:rtl;
}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.en{direction:ltr;text-align:left;font-family:"IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px}

/* ───────────── rail ───────────── */
.rail{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:var(--card); border-bottom:1px solid var(--line);
}
.rail-in{max-width:860px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:14px}
.mark{display:flex;flex-direction:column;line-height:1.2;margin-inline-end:auto;min-width:0}
.mark b{font-size:14px;font-weight:600;white-space:nowrap}
.mark span{
  font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap
}
.gauge{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.gauge u{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);text-decoration:none}
.gauge b{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.gauge.warn b{color:var(--amber)} .gauge.crit b{color:var(--bad)}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;border-radius:8px;
  border:1px solid var(--line);color:var(--muted);flex:none
}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

/* ───────────── shared bits ───────────── */
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint)
}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--card-2);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.04em;color:var(--muted);
  white-space:nowrap
}
.chip.sec{background:var(--navy-soft);border-color:var(--navy-line);color:var(--navy)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 16px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);font-size:14px;font-weight:500
}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--on-accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default}

/* ───────────── start screen ───────────── */
.hero{padding-block:30px 8px}
.hero h1{margin:6px 0 0;font-size:clamp(25px,5.2vw,33px);font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.hero p{margin:10px 0 0;color:var(--muted);font-size:15.5px;max-width:60ch}

.spec{
  margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);overflow:hidden
}
.spec-h{padding:11px 15px;border-bottom:1px solid var(--line-soft);background:var(--card-2);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spec-h b{font-size:13.5px;font-weight:600}
table.bp{width:100%;border-collapse:collapse;font-size:13.5px}
table.bp th,table.bp td{padding:8px 15px;text-align:right;border-bottom:1px solid var(--line-soft)}
table.bp th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
table.bp tr:last-child td{border-bottom:0}
table.bp td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;width:1%;white-space:nowrap}
table.bp td.rom{font-family:"IBM Plex Mono",monospace;color:var(--faint);width:1%}
table.bp tr.law td{background:var(--navy-soft)}
table.bp tr.tot td{font-weight:600;background:var(--card-2)}
.bar{display:inline-block;height:7px;border-radius:3px;background:var(--navy);opacity:.8;vertical-align:middle}

.forms{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:20px 0 0}
.form-card{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  padding:15px;text-align:right;display:flex;flex-direction:column;gap:9px;width:100%;
  box-shadow:var(--shadow)
}
.form-card:hover{border-color:var(--navy-line);background:var(--card-2)}
.form-card .letter{
  font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;color:var(--navy);line-height:1
}
.form-card h3{margin:0;font-size:15px;font-weight:600}
.form-card p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.form-card .state{
  display:flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--faint);border-top:1px solid var(--line-soft);padding-top:9px
}
.form-card .state.done{color:var(--good)} .form-card .state.mid{color:var(--amber)}

.note{margin:22px 0 34px;padding:13px 15px;border-inline-start:3px solid var(--amber);
  background:var(--amber-soft);border-radius:0 var(--r) var(--r) 0;font-size:13.5px;color:var(--ink)}
.note b{font-weight:600}

/* ───────────── question ───────────── */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:20px 0 0}
.qnum{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint);margin-inline-end:auto}
.qcard{
  margin:12px 0 0;border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  box-shadow:var(--shadow);overflow:hidden
}
.stem{padding:19px 20px;font-size:17px;line-height:1.55;border-bottom:1px solid var(--line-soft)}
.opts{display:flex;flex-direction:column}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;direction:ltr;
  padding:13px 20px;border-bottom:1px solid var(--line-soft);font-size:15.5px;line-height:1.5
}
.opt:last-child{border-bottom:0}
.opt:hover{background:var(--card-2)}
.opt .ltr{
  flex:none;width:23px;height:23px;border-radius:6px;border:1px solid var(--line);
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--muted);margin-top:1px
}
.opt.on{background:var(--navy-soft)}
.opt.on .ltr{background:var(--navy);border-color:var(--navy);color:var(--on-accent);font-weight:600}
.opt.key{background:var(--good-soft)}
.opt.key .ltr{background:var(--good);border-color:var(--good);color:var(--on-accent);font-weight:600}
.opt.wrong{background:var(--bad-soft)}
.opt.wrong .ltr{background:var(--bad);border-color:var(--bad);color:var(--on-accent);font-weight:600}
.opt.static{cursor:default}
.opt.static:hover{background:inherit}
.opt.key.static:hover{background:var(--good-soft)}
.opt.wrong.static:hover{background:var(--bad-soft)}

/* nav bar */
.navbar{
  position:sticky;bottom:0;z-index:25;margin-top:16px;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
.navbar-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.flagbtn{border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13.5px;color:var(--muted)}
.flagbtn:hover{background:var(--sunk)}
.flagbtn.on{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.spacer{flex:1}
.askrow{font-size:14px;font-weight:600;line-height:1.35}

/* navigator */
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;
  margin:14px 0 0;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)
}
.cell{
  aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--card-2);
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);
  display:grid;place-items:center;position:relative
}
.cell:hover{border-color:var(--navy-line)}
.cell.ans{background:var(--navy-soft);border-color:var(--navy-line);color:var(--navy);font-weight:600}
.cell.cur{outline:2px solid var(--navy);outline-offset:1px}
.cell.flag::after{
  content:"";position:absolute;top:3px;inset-inline-end:3px;width:6px;height:6px;
  border-radius:50%;background:var(--bad)
}
.cell.ok{background:var(--good-soft);border-color:var(--good-line);color:var(--good);font-weight:600}
.cell.no{background:var(--bad-soft);border-color:var(--bad-line);color:var(--bad);font-weight:600}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:9px 2px 0;font-size:11.5px;color:var(--faint)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-inline-end:5px;border:1px solid var(--line)}

/* ───────────── results ───────────── */
.verdict{
  margin:22px 0 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);
  box-shadow:var(--shadow)
}
.verdict-top{padding:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.score{font-family:"IBM Plex Mono",monospace;font-size:46px;font-weight:600;line-height:1;letter-spacing:-.02em}
.score s{text-decoration:none;font-size:22px;color:var(--faint)}
.verdict-txt{flex:1;min-width:190px}
.verdict-txt b{display:block;font-size:19px;font-weight:600;margin-bottom:3px}
.verdict-txt span{font-size:13.5px;color:var(--muted)}
.pass .score,.pass .verdict-txt b{color:var(--good)}
.fail .score,.fail .verdict-txt b{color:var(--bad)}
.meter{height:9px;background:var(--sunk);position:relative;border-top:1px solid var(--line-soft)}
.meter i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--navy)}
.pass .meter i{background:var(--good)} .fail .meter i{background:var(--bad)}
.meter u{position:absolute;inset-block:-4px;width:2px;background:var(--ink);opacity:.55}

table.sec{width:100%;border-collapse:collapse;font-size:13.5px;margin:0}
table.sec th,table.sec td{padding:9px 15px;text-align:right;border-bottom:1px solid var(--line-soft)}
table.sec th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);font-weight:500}
table.sec tr:last-child td{border-bottom:0}
table.sec td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;width:1%;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:6px;vertical-align:0}
.dot.up{background:var(--good)} .dot.dn{background:var(--bad)} .dot.eq{background:var(--faint)}

.tools{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 4px;align-items:center}
.rev{margin:0 0 30px}
.rev-item{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin:12px 0 0;overflow:hidden
}
.rev-item.miss{border-color:var(--bad-line)}
.rev-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 15px;background:var(--card-2);
  border-bottom:1px solid var(--line-soft)}
.rev-h .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--faint)}
.rev-h .tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.no{background:var(--bad-soft);color:var(--bad)}
.tag.skip{background:var(--amber-soft);color:var(--amber)}
.rev-stem{padding:15px 16px 4px;font-size:15.5px;line-height:1.5}
.expl{padding:4px 16px 16px;display:flex;flex-direction:column;gap:11px}
.fld{border-inline-start:2px solid var(--line);padding-inline-start:11px}
.fld u{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);text-decoration:none;margin-bottom:2px}
.fld p{margin:0;font-size:14px;line-height:1.6}
.fld.hook{border-inline-start-color:var(--navy);background:var(--navy-soft);
  padding:9px 11px;border-radius:0 8px 8px 0}
.fld.hook p{font-weight:600;color:var(--navy)}
.quote{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:9px 11px;
  direction:ltr;text-align:left;font-style:italic}

.foot{padding:26px 0 40px;color:var(--faint);font-size:12px;line-height:1.7;border-top:1px solid var(--line-soft);margin-top:26px}

@media (max-width:520px){
  .stem{padding:16px}
  .opt{padding:12px 16px;font-size:15px}
  .rail-in{gap:10px}
  .verdict-top{padding:16px;gap:14px}
  .score{font-size:38px}
}

/* the passphrase gate — the questions ship as ciphertext, same code as the
   drill room, so this page can live in the public repo too */
.lock{direction:rtl;max-width:420px;margin:14vh auto;padding:0 20px;text-align:center}
.lock h1{font-size:25px;margin:0 0 6px;letter-spacing:-.01em;font-weight:600}
.lock p{color:var(--muted);font-size:15px;margin:0 0 22px;line-height:1.6}
.lock form{display:flex;gap:8px}
.lock input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:var(--r);
     background:var(--card);color:var(--ink);direction:ltr;text-align:left;
     font-family:"IBM Plex Mono",monospace;font-size:15px}
.lock .err{color:var(--bad);font-size:14px;margin-top:14px;min-height:20px;font-weight:600}
</style>

<div id="lock" class="lock" hidden>
  <h1>מבחני דמה · טקסס</h1>
  <p>חומר לימוד פרטי.<br>התוכן מוצפן — הקלידי את הסיסמה כדי לפתוח.<br>
     <small>אותה סיסמה של חדר התרגול.</small></p>
  <form id="lockform"><input id="pass" type="password" autocomplete="current-password"
    placeholder="passphrase" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="btn primary" type="submit">פתחי</button></form>
  <div class="err" id="lockerr"></div>
</div>

<div class="rail">
  <div class="rail-in">
    <span class="mark"><b id="railTitle">מבחני דמה · טקסס</b><span id="railSub">TREC · STATE EXAM</span></span>
    <span class="gauge" id="gTime" hidden><u>זמן</u><b id="clock">45:00</b></span>
    <span class="gauge" id="gProg" hidden><u>נענו</u><b id="prog">0/30</b></span>
    <button class="icon-btn" id="themeBtn" title="מצב תצוגה" aria-label="החלפת מצב תצוגה">◐</button>
  </div>
</div>

<main class="wrap" id="app"></main>

<script>
let DATA = {forms:{}};

/* ── the official content outline, scaled to a 30-question form ──────────── */
const BP = [
  {n:1, rom:"I",   he:"מבנה — חריגי ה-SOP של טקסס",        want:2,  mean:87},
  {n:2, rom:"II",  he:"חשמל — חריגים ודיווח ייחודי",        want:4,  mean:80},
  {n:3, rom:"III", he:"מכני — מיזוג, אינסטלציה, מכשירים",   want:4,  mean:86},
  {n:4, rom:"IV",  he:"חוק הרישוי — Occ. Code 1102",        want:11, mean:74},
  {n:5, rom:"V",   he:"הוראות כלליות — 22 TAC 535 סאב' R",  want:9,  mean:77},
];
const BPBY = Object.fromEntries(BP.map(b=>[b.n,b]));
const PASS = 23;              // Professional Inspector passes at 19/25 = 76%, scaled to 30
const MINUTES = 45;
const LETTERS = ["A","B","C","D"];
const FORM_NOTE = {
  A:"אחריות פיננסית, פיקוח וחסות, כשירות לרישיון ומעשים אסורים; ומהתקנות — ביטוח, פרסום, מועד מסירת הדוח וטופס REI 7-6. ה-SOP: יסודות וגג, לוח חשמל ו-GFCI, חימום, מים חמים וכיריים.",
  B:"הוועדה, הבחינה, חידוש רישיון ועילות לפעולה משמעתית; ומהתקנות — הגדרת «לקוח», סטטוס לא פעיל, השתלמות, אתיקה וחסות. ה-SOP: ניקוז ועליית גג, מעגלים, גלאי עשן, קירור ותעלות.",
  C:"אכיפה, עונשים, ביטול קרן השיפוי, תקופת הרישיון ופיקוח עקיף; ומהתקנות — אגרות, סדרי דין, הגדרות התקן וציוד מיוחד. ה-SOP: פנים ופתחים, רשימת הפטורים בחשמל, גז, מכשירים ומערכות אופציונליות.",
};

/* ── state ───────────────────────────────────────────────────────────────── */
const LS = "tx-mock-v1";
let store = {};
try{ store = JSON.parse(localStorage.getItem(LS) || "{}") || {}; }catch(e){ store = {}; }
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

let view = "home";      // home | exam | result
let form = null;        // "A" | "B" | "C"
let idx = 0;
let showAll = true;     // review filter
let confirming = false; // the submit confirmation row is open
let ticker = null;

function blank(){ return {answers:{}, flags:{}, left:MINUTES*60, done:false, started:false}; }
function st(){ if(!store[form]) store[form] = blank(); return store[form]; }
function items(){ return DATA.forms[form] || []; }

/* ── theme ───────────────────────────────────────────────────────────────── */
try{ const t = localStorage.getItem(LS+"-theme"); if(t) document.documentElement.setAttribute("data-theme", t); }catch(e){}
document.getElementById("themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = window.matchMedia("(prefers-color-scheme:dark)").matches;
  const next = cur ? (cur === "dark" ? "light" : "dark") : (dark ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(LS+"-theme", next); }catch(e){}
};

/* ── helpers ─────────────────────────────────────────────────────────────── */
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const mmss = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
function answered(s){ return Object.keys(s.answers).length; }
function scoreOf(s, list){
  let n = 0; list.forEach((it,i)=>{ if(s.answers[i] === it.key) n++; });
  return n;
}

}

function exam(){

function result(){
  const s = st(), list = items();
  const sc = scoreOf(s, list), pass = sc >= PASS;
  const pct = Math.round(sc/list.length*100);

  const rows = BP.map(b => {
    const ix = list.map((it,i)=>[it,i]).filter(([it]) => it.bp === b.n);
    const got = ix.filter(([it,i]) => s.answers[i] === it.key).length;
    const p = ix.length ? Math.round(got/ix.length*100) : 0;
    const d = p - b.mean;
    const cls = Math.abs(d) < 8 ? "eq" : d > 0 ? "up" : "dn";
    return `<tr>
      <td class="rom mono">${b.rom}</td>
      <td>${esc(b.he)}</td>
      <td class="num">${got}/${ix.length}</td>
      <td class="num">${p}%<span class="dot ${cls}"></span></td>
      <td class="num" style="color:var(--faint)">${b.mean}%</td>
    </tr>`;
  }).join("");

  const revs = list.map((it,i) => {
    const a = s.answers[i], ok = a === it.key, skipped = a === undefined;
    if(!showAll && ok) return "";
    const b = BPBY[it.bp] || {rom:"?"};
    const opts = it.options.map((o,j) => {
      let cls = "opt static";
      if(j === it.key) cls += " key";
      else if(j === a) cls += " wrong";
      return `<div class="${cls}"><span class="ltr mono">${LETTERS[j]}</span><span>${esc(o)}</span></div>`;
    }).join("");
    const tag = skipped ? `<span class="tag skip">לא נענתה</span>`

    return `

      </div>
    </div>`;
  }).join("");

  const used = MINUTES*60 - s.left;
  const wrong = list.filter((it,i)=> s.answers[i] !== it.key).length;

  return `
  <div class="qhead" style="padding-top:22px">
    <span class="eyebrow">טופס ${form} · תוצאה</span>
  </div>

  <div class="verdict ${pass?"pass":"fail"}">
    <div class="verdict-top">
      <span class="score mono">${sc}<s>/${list.length}</s></span>
      <span class="verdict-txt">
        <b>${pass?"עברת":"לא עברת"}</b>
        <span>${pct}% · רף המעבר ${PASS} מתוך ${list.length} · ${wrong} שגיאות · ${mmss(used)} דקות</span>
      </span>
    </div>
    <div class="meter">
      <i style="width:${pct}%"></i>
      <u style="inset-inline-start:${Math.round(PASS/list.length*100)}%"></u>
    </div>
    <table class="sec">
      <tr><th>חלק</th><th>נושא</th><th>נכונות</th><th>שלך</th><th>ממוצע ארצי</th></tr>
      ${rows}
    </table>
  </div>

  <div class="tools">
    <button class="btn" id="toggle">${showAll?"רק השגויות":"הצגת הכול"}</button>
    <button class="btn" id="again">מבחן חוזר</button>
    <button class="btn" id="home">לכל הטפסים</button>
  </div>

  <div class="rev">${revs || `<div class="note" style="border-color:var(--good);background:var(--good-soft)">כל התשובות נכונות.</div>`}</div>`;
}

/* ── events ──────────────────────────────────────────────────────────────── */
function wire(){
  document.querySelectorAll("[data-form]").forEach(el => el.onclick = () => {
    form = el.dataset.form;
    const s = st();
    if(s.done){ view = "result"; render(); return; }
    s.started = true; idx = 0; view = "exam"; save(); startClock(); render();
  });
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => pick(+el.dataset.pick));
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { idx = +el.dataset.go; render(); });
  const on = (id, fn) => { const e = document.getElementById(id); if(e) e.onclick = fn; };
  on("prev", () => { if(idx>0){ idx--; render(); } });
  on("next", () => { if(idx < items().length-1){ idx++; render(); } });
  on("flag", () => { const s = st(); s.flags[idx] = !s.flags[idx]; save(); render(); });
  on("submit", submit);
  on("cancelsub", () => { confirming = false; render(); });
  on("dosub", () => { confirming = false; finish(); });
  on("toggle", () => { showAll = !showAll; render(); });
  on("home",  () => { stopClock(); view = "home"; form = null; render(); });
  on("again", () => {
    store[form] = blank(); store[form].started = true;
    idx = 0; showAll = true; confirming = false; view = "exam"; save(); startClock(); render();
  });
  if(view === "exam"){
    document.getElementById("prog").textContent = answered(st()) + "/" + items().length;
    paintClock();
  }
}

function pick(i){
  const s = st();
  s.answers[idx] = i; save();
  if(idx < items().length-1){ idx++; render(); }
  else render();
}

/* An artifact runs in a sandboxed iframe with no allow-modals, so window.confirm()
   returns false without ever showing anything and the button looks dead. Ask in the
   page instead. */
function submit(){ confirming = true; render(); }

function finish(){
  const s = st(); s.done = true; save();
  stopClock(); showAll = true; view = "result"; render();
}

/* ── clock ───────────────────────────────────────────────────────────────── */
function startClock(){
  stopClock();
  ticker = setInterval(() => {
    const s = st();
    if(view !== "exam" || s.done){ stopClock(); return; }
    s.left--;
    if(s.left <= 0){ s.left = 0; save(); finish(); return; }
    if(s.left % 10 === 0) save();
    paintClock();
  }, 1000);
}
function stopClock(){ if(ticker){ clearInterval(ticker); ticker = null; } }
function paintClock(){
  const s = st(), g = document.getElementById("gTime"), c = document.getElementById("clock");
  if(!c) return;
  c.textContent = mmss(s.left);
  g.className = "gauge" + (s.left <= 60 ? " crit" : s.left <= 300 ? " warn" : "");
}

document.addEventListener("keydown", e => {
  if(view !== "exam" || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key >= "1" && e.key <= "4"){ const n = +e.key-1; if(n < items()[idx].options.length){ pick(n); e.preventDefault(); } }
  else if(e.key === "ArrowLeft"){ if(idx < items().length-1){ idx++; render(); } }
  else if(e.key === "ArrowRight"){ if(idx > 0){ idx--; render(); } }
  else if(e.key === "f" || e.key === "F"){ const s = st(); s.flags[idx] = !s.flags[idx]; save(); render(); }

var KEYCHECK="nhie-drill-pass";          /* shared with the drill room on purpose:
                                            unlock either page and both open */
function b64(s){ var b=atob(s), a=new Uint8Array(b.length);
  for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
document.getElementById("lock").hidden=false;
var lockerr=document.getElementById("lockerr");
var unlocking=false, started=false;

async function decrypt(pass){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  var key=await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(CT));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryPass(pass, remember){
  if(unlocking || started) return false;
  unlocking=true;
  lockerr.textContent="פותחת…";
  try{
    var parsed=await decrypt(pass);
    if(started) return true;
    started=true;
    if(remember){ try{ localStorage.setItem(KEYCHECK, pass); }catch(e){} }
    DATA=parsed;
    document.getElementById("lock").hidden=true;
    render();
    return true;
  }catch(e){
    unlocking=false;
    lockerr.textContent="סיסמה שגויה";
    try{ localStorage.removeItem(KEYCHECK); }catch(e2){}
    return false;
  }
}
